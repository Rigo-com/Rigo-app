<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIGO Dashboard</title><style>*{box-sizing:border-box}body{background:#020817;color:white;font-family:Arial;padding:24px}.container{max-width:1200px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:20px}.card-content{white-space:pre-wrap;color:#cbd5e1}.back{color:white}</style></head><body><div class="container"><div class="header"><h1>📊 RIGO Dashboard</h1><a class="back" href="./debug.html">← Debug Center</a></div><div class="grid"><div class="card"><h3>System Health</h3><div id="health" class="card-content">Loading...</div></div><div class="card"><h3>Diagnostics</h3><div id="diagnostics" class="card-content">Loading...</div></div><div class="card"><h3>Monitors</h3><div id="monitors" class="card-content">Loading...</div></div></div></div><script type="module">import{applicationReady}from"./js/main.js";import Auth from"./js/auth/index.js";await applicationReady;const a=Auth.status();if(!a?.authenticated){location.replace("./login.html");throw new Error("AUTHENTICATION_REQUIRED")}if(a?.user?.role!=="admin"){location.replace("./home.html");throw new Error("ADMIN_ACCESS_REQUIRED")}const{default:Debug}=await import("./js/debug/index.js");Debug.initialize();const s=Debug.snapshot(),d=s.diagnostics||{};document.getElementById("health").textContent=`Health Score: ${d.healthScore??100}%\nWarnings: ${d.warnings??0}\nErrors: ${d.errors??0}\nCritical: ${d.critical??0}`;document.getElementById("diagnostics").textContent=JSON.stringify(d,null,2);document.getElementById("monitors").textContent=JSON.stringify({memory:s.memory,performance:s.performance,network:s.network,events:s.events,services:s.services},null,2)</script></body></html>
