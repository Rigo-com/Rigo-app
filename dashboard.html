<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    RIGO Dashboard
  </title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      min-height:100vh;

      background:#020817;

      color:white;

      font-family:Arial,sans-serif;

      padding:24px;

    }

    .container{

      max-width:1200px;

      margin:0 auto;

    }

    .header{

      display:flex;

      justify-content:space-between;

      align-items:center;

      margin-bottom:24px;

    }

    .title{

      font-size:36px;

      font-weight:700;

    }

    .back-btn{

      text-decoration:none;

      color:white;

      background:#0f172a;

      border:1px solid #1e293b;

      padding:12px 18px;

      border-radius:12px;

    }

    .grid{

      display:grid;

      grid-template-columns:
      repeat(
        auto-fit,
        minmax(
          320px,
          1fr
        )
      );

      gap:20px;

    }

    .card{

      background:#0f172a;

      border:1px solid #1e293b;

      border-radius:18px;

      padding:20px;

    }

    .card-title{

      font-size:20px;

      font-weight:700;

      margin-bottom:16px;

    }

    .card-content{

      white-space:pre-wrap;

      line-height:1.7;

      color:#cbd5e1;

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="header">

      <div class="title">
        📊 RIGO Dashboard
      </div>

      <a
        href="./debug.html"
        class="back-btn">

        ← Debug Center

      </a>

    </div>

    <div class="grid">

      <div class="card">

        <div class="card-title">
          System Health
        </div>

        <div
          id="health"
          class="card-content">

          Loading...

        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Diagnostics
        </div>

        <div
          id="diagnostics"
          class="card-content">

          Loading...

        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Monitors
        </div>

        <div
          id="monitors"
          class="card-content">

          Loading...

        </div>

      </div>

    </div>

  </div>

  <script type="module">

    import Debug
    from "./js/debug/index.js";

    try{

      Debug.initialize();
      
      const snapshot =
      Debug.snapshot();

      alert(
  JSON.stringify(
    Debug.snapshot(),
    null,
    2
  )
);

      const diagnostics =
      snapshot.diagnostics || {};

      document
      .getElementById(
        "health"
      )
      .innerHTML = `

Health Score:
<b>${diagnostics.healthScore ?? 100}%</b>

<br><br>

Warnings:
${diagnostics.warnings ?? 0}

<br>

Errors:
${diagnostics.errors ?? 0}

<br>

Critical:
${diagnostics.critical ?? 0}

`;

      document
      .getElementById(
        "diagnostics"
      )
      .textContent =

      JSON.stringify(
        diagnostics,
        null,
        2
      );

      document
      .getElementById(
        "monitors"
      )
      .textContent =

      JSON.stringify({

        memory:
        snapshot.memory,

        performance:
        snapshot.performance,

        network:
        snapshot.network,

        events:
        snapshot.events,

        services:
        snapshot.services

      },
      null,
      2);

    }

    catch(error){

      document.body.innerHTML =
      `<pre>${error.stack || error}</pre>`;

    }

  </script>

</body>

</html>
