<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIGO Snapshot</title><style>*{box-sizing:border-box}body{background:#020817;color:white;font-family:Arial;padding:24px}.container{max-width:1200px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.card{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:20px}.card-content{white-space:pre-wrap;color:#cbd5e1}.back{color:white}</style></head><body><div class="container"><div class="header"><h1>📦 RIGO Snapshot</h1><a class="back" href="./debug.html">← Debug Center</a></div><div class="grid"><div class="card"><h3>Memory Monitor</h3><div id="memory" class="card-content"></div></div><div class="card"><h3>Performance Monitor</h3><div id="performance" class="card-content"></div></div><div class="card"><h3>Network Monitor</h3><div id="network" class="card-content"></div></div><div class="card"><h3>Event Monitor</h3><div id="events" class="card-content"></div></div><div class="card"><h3>Service Monitor</h3><div id="services" class="card-content"></div></div></div></div><script type="module">import{applicationReady}from"./js/main.js";import Auth from"./js/auth/index.js";await applicationReady;const a=Auth.status();if(!a?.authenticated){location.replace("./login.html");throw new Error("AUTHENTICATION_REQUIRED")}if(a?.user?.role!=="admin"){location.replace("./home.html");throw new Error("ADMIN_ACCESS_REQUIRED")}const{default:Debug}=await import("./js/debug/index.js");Debug.initialize();const s=Debug.snapshot();for(const k of["memory","performance","network","events","services"])document.getElementById(k).textContent=JSON.stringify(s[k],null,2)</script></body></html>
