<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    RIGO Snapshot
  </title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      min-height:100vh;

      background:#020817;

      color:white;

      font-family:Arial,sans-serif;

      padding:24px;

    }

    .container{

      max-width:1200px;

      margin:0 auto;

    }

    .header{

      display:flex;

      justify-content:space-between;

      align-items:center;

      margin-bottom:32px;

    }

    .title{

      font-size:34px;

      font-weight:700;

    }

    .back-btn{

      text-decoration:none;

      color:white;

      background:#0f172a;

      border:1px solid #1e293b;

      padding:12px 18px;

      border-radius:12px;

    }

    .grid{

      display:grid;

      grid-template-columns:
      repeat(
        auto-fit,
        minmax(
          280px,
          1fr
        )
      );

      gap:20px;

    }

    .card{

      background:#0f172a;

      border:1px solid #1e293b;

      border-radius:18px;

      padding:20px;

    }

    .card-title{

      font-size:18px;

      font-weight:700;

      margin-bottom:12px;

    }

    .card-content{

      color:#cbd5e1;

      white-space:pre-wrap;

      line-height:1.6;

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="header">

      <div class="title">
        📦 RIGO Snapshot
      </div>

      <a
        href="./debug.html"
        class="back-btn">

        ← Debug Center

      </a>

    </div>

    <div class="grid">

      <div class="card">

        <div class="card-title">
          Memory Monitor
        </div>

        <div
          id="memory"
          class="card-content">

          Loading...

        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Performance Monitor
        </div>

        <div
          id="performance"
          class="card-content">

          Loading...

        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Network Monitor
        </div>

        <div
          id="network"
          class="card-content">

          Loading...

        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Event Monitor
        </div>

        <div
          id="events"
          class="card-content">

          Loading...

        </div>

      </div>

      <div class="card">

        <div class="card-title">
          Service Monitor
        </div>

        <div
          id="services"
          class="card-content">

          Loading...

        </div>

      </div>

    </div>

  </div>

  <script type="module">

    import Debug
    from "./js/debug/index.js";

    try{

      const snapshot =
      Debug.snapshot();

      document
      .getElementById(
        "memory"
      )
      .textContent =

      JSON.stringify(
        snapshot.memory,
        null,
        2
      );

      document
      .getElementById(
        "performance"
      )
      .textContent =

      JSON.stringify(
        snapshot.performance,
        null,
        2
      );

      document
      .getElementById(
        "network"
      )
      .textContent =

      JSON.stringify(
        snapshot.network,
        null,
        2
      );

      document
      .getElementById(
        "events"
      )
      .textContent =

      JSON.stringify(
        snapshot.events,
        null,
        2
      );

      document
      .getElementById(
        "services"
      )
      .textContent =

      JSON.stringify(
        snapshot.services,
        null,
        2
      );

    }

    catch(error){

      document.body.innerHTML =
      `<pre>${error.stack || error}</pre>`;

    }

  </script>

</body>

</html>
