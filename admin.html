<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIGO Admin Studio</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020817;color:white;font-family:Arial,sans-serif;min-height:100vh}</style></head><body><div id="studio-root"></div><script type="module">
const sessionResponse=await fetch("/api/admin-session",{method:"GET",credentials:"same-origin",cache:"no-store"});const session=await sessionResponse.json().catch(()=>({}));if(!sessionResponse.ok||!session?.authenticated||!session?.admin){location.replace("./home.html");throw new Error("SERVER_ADMIN_ACCESS_REQUIRED")}
const[{applicationReady},{default:StudioUI}]=await Promise.all([import("./js/main.js"),import("./js/admin/studio/ui/index.js")]);await applicationReady;await StudioUI.mount(document.getElementById("studio-root"));
</script></body></html>
