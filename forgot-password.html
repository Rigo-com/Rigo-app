<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>RIGO AI Reset Password</title>

  <link
    rel="stylesheet"
    href="./css/forgot-password.css">

<style>.reset-notice{width:100%;box-sizing:border-box;padding:14px 16px;margin:8px 0 18px;border:1px solid rgba(148,163,184,.25);border-radius:12px;color:#94a3b8;font-size:14px;line-height:1.5;text-align:center}</style></head>

<body>

  <div class="reset-screen">

    <div class="reset-content">

      <img
        class="logo"
        src="./assets/rigo-logo.PNG"
        alt="RIGO AI">

      <h1 class="title">
        Reset Password
      </h1>

      <p class="subtitle">
        Enter your email address
      </p>

      <input
        class="input-field"
        type="email"
        placeholder="Email Address">

      <div class="reset-notice" role="status">Password reset by email is not configured yet. Please contact RIGO support to reset your password.</div>

      <a
        href="./login.html"
        class="back-link">
        Back to Sign In
      </a>

    </div>

  </div>

</body>

</html>
