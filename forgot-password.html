<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RIGO AI Reset Password</title><link rel="stylesheet" href="./css/forgot-password.css"></head>
<body><div class="reset-screen"><form class="reset-content" id="reset-form" novalidate>
<img class="logo" src="./assets/rigo-logo.PNG" alt="RIGO AI"><h1 class="title">Reset Password</h1><p class="subtitle">Enter your email and we’ll send you a verification code.</p>
<input id="reset-email" class="input-field" type="email" autocomplete="email" placeholder="Email Address" required>
<div id="reset-error" role="alert" aria-live="polite" style="min-height:20px;color:#ef4444;font-size:14px;text-align:center"></div>
<button id="reset-submit" type="submit" class="reset-button">Send Reset Code</button><a href="./login.html" class="back-link">Back to Sign In</a>
</form></div>
<script>
const form=document.getElementById("reset-form"),email=document.getElementById("reset-email"),submit=document.getElementById("reset-submit"),error=document.getElementById("reset-error");
form.addEventListener("submit",async e=>{e.preventDefault();error.textContent="";const value=email.value.trim().toLowerCase();if(!value||!value.includes("@")){error.textContent="Enter a valid email address.";return}submit.disabled=true;try{const response=await fetch("./api/neon-auth?action=request-reset",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:value})});const text=await response.text();let payload={};try{payload=text?JSON.parse(text):{}}catch{}if(!response.ok)throw new Error(payload.error||"Unable to send reset code.");location.replace("./otp.html?mode=reset&email="+encodeURIComponent(value))}catch(err){error.textContent=err.message||"Unable to send reset code.";submit.disabled=false}});
</script></body></html>
