<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>RIGO AI Reset Password</title>

  <link
    rel="stylesheet"
    href="./css/forgot-password.css">

</head>

<body>

  <div class="reset-screen">

    <div class="reset-content">

      <img
        class="logo"
        src="./assets/rigo-logo.PNG"
        alt="RIGO AI">

      <h1 class="title">
        Reset Password
      </h1>

      <p class="subtitle">
        Enter your email address
      </p>

      <input
        class="input-field"
        type="email"
        placeholder="Email Address">

      <button
        class="reset-button">
        Send Reset Link
      </button>

      <a
        href="./login.html"
        class="back-link">
        Back to Sign In
      </a>

    </div>

  </div>

</body>

</html>
