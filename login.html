<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RIGO AI Login</title><link rel="stylesheet" href="./css/login.css"><style>.stay-row{width:100%;display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:14px;margin:4px 0 14px;cursor:pointer}.stay-row input{width:18px;height:18px;accent-color:#65c466}</style></head><body><div class="login-screen"><form class="login-content" id="login-form" novalidate><img class="logo" src="./assets/rigo-logo.PNG" alt="RIGO AI"><h1 class="title">Welcome Back</h1><p class="subtitle">Sign in to continue</p><input id="login-email" class="input-field" type="email" autocomplete="email" placeholder="Email Address" required><input id="login-password" class="input-field" type="password" autocomplete="current-password" placeholder="Password" required><label class="stay-row"><input id="stay-signed-in" type="checkbox"><span>Stay signed in</span></label><div class="login-links"><a href="./forgot-password.html" class="forgot-password">Forgot Password?</a><button type="button" class="google-link" disabled>Continue with Google</button></div><div id="login-error" role="alert" aria-live="polite" style="min-height:20px;color:#ef4444;font-size:14px;text-align:center"></div><button id="login-submit" type="submit" class="continue-button">Continue</button><a href="./register.html" class="create-account">Create New Account</a></form></div><script type="module">
import Auth from"./js/auth/index.js";const form=document.getElementById("login-form"),email=document.getElementById("login-email"),password=document.getElementById("login-password"),stay=document.getElementById("stay-signed-in"),submit=document.getElementById("login-submit"),error=document.getElementById("login-error");await Auth.initialize();if(Auth.status().authenticated)location.replace("./home.html");form.addEventListener("submit",async e=>{e.preventDefault();error.textContent="";submit.disabled=true;const success=await Auth.login({email:email.value,password:password.value,staySignedIn:stay.checked});if(success){location.replace("./home.html");return}error.textContent=Auth.status().error||"Unable to sign in.";submit.disabled=false});
</script></body></html>
