<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>RIGO AI Login</title>

  <link
    rel="stylesheet"
    href="./css/login.css">

</head>

<body>

  <div class="login-screen">

    <div class="login-content">

      <img
        class="logo"
        src="./assets/rigo-logo.PNG"
        alt="RIGO AI">

      <h1 class="title">
        RIGO AI
      </h1>

      <p class="subtitle">
        Sign in to continue
      </p>

      <button class="google-button">
        Continue with Google
      </button>

      <div class="divider">
        OR
      </div>

      <input
        class="phone-input"
        type="email"
        placeholder="Email Address">

      <button class="otp-button">
        Continue with Email
      </button>

      <div class="divider">
        OR
      </div>

      <input
        class="phone-input"
        type="tel"
        placeholder="Phone Number">

      <button class="otp-button">
        Continue with Phone Number
      </button>

    </div>

  </div>

</body>

</html>
