<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>RIGO AI Login</title>

  <link
    rel="stylesheet"
    href="./css/login.css">

</head>

<body>

  <div class="login-screen">

    <div class="login-content">

      <img
        class="logo"
        src="./assets/rigo-logo.PNG"
        alt="RIGO AI">

      <h1 class="title">
        Welcome Back
      </h1>

      <p class="subtitle">
        Sign in to continue
      </p>

      <input
        class="input-field"
        type="email"
        placeholder="Email Address">

      <input
        class="input-field"
        type="password"
        placeholder="Password">

      <a
        href="#"
        class="forgot-password">
        Forgot Password?
      </a>

      <button
        class="continue-button">
        Continue
      </button>

      <button
        class="google-link">
        Continue with Google
      </button>

    </div>

  </div>

</body>

</html>
