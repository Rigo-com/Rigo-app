<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIGO Diagnostics</title><style>*{box-sizing:border-box}html{background:#020817}body{visibility:hidden;background:#020817;color:white;font-family:Arial;padding:24px}.container{max-width:1200px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:24px}.value{font-size:32px;font-weight:700}.back{color:white}</style></head><body><div class="container"><div class="header"><h1>RIGO Diagnostics</h1><a class="back" href="./debug.html">← Debug Center</a></div><div class="grid"><div class="card">Health Score<div id="health" class="value">--</div></div><div class="card">Warnings<div id="warnings" class="value">--</div></div><div class="card">Errors<div id="errors" class="value">--</div></div><div class="card">Critical Issues<div id="critical" class="value">--</div></div><div class="card">Runtime Errors<div id="runtime" class="value">--</div></div><div class="card">Deep Scans<div id="scans" class="value">--</div></div></div></div><script type="module">const r=await fetch("/api/admin-session",{credentials:"same-origin",cache:"no-store"});const a=await r.json().catch(()=>({}));if(!r.ok||!a?.authenticated||!a?.admin){location.replace("./home.html");throw new Error("SERVER_ADMIN_ACCESS_REQUIRED")}const{default:Debug}=await import("./js/debug/index.js");await Debug.boot();const s=Debug.snapshot(),d=s.diagnostics||{},rt=s.runtime||{};document.getElementById("health").textContent=(d.healthScore??0)+"%";document.getElementById("warnings").textContent=d.warnings??0;document.getElementById("errors").textContent=d.errors??0;document.getElementById("critical").textContent=d.critical??0;document.getElementById("runtime").textContent=(rt.runtimeErrors??0)+(rt.promiseRejections??0);document.getElementById("scans").textContent=(s.module?.scanned??0)+(s.imports?.scanned??0)+(s.dependency?.scanned??0)+(s.syntax?.scanned??0)+(s.circular?.scanned??0);document.body.style.visibility="visible";</script></body></html>
