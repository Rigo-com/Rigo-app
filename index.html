<!DOCTYPE html>
<html lang="ar">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#071321"
  />

  <title>RIGO AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body dir="rtl">

  <!-- SIDEBAR OVERLAY -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
    style="display:none;"
  ></div>



  <!-- LOADING SCREEN -->

  <div
    class="loading-screen"
    id="loadingScreen"
    style="display:none;"
  >

    <div class="loader"></div>

    <h1>
      RIGO AI
    </h1>

  </div>



  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <h2>
        RIGO AI
      </h2>



      <button
        id="closeSidebar"
      >

        ✕

      </button>

    </div>



    <button
      class="new-chat-btn"
      id="newChatBtn"
    >

      + New Chat

    </button>



    <div
      class="chat-history"
      id="chatHistory"
    >

    </div>

  </aside>



  <!-- MAIN -->

  <main class="main">

    <!-- HEADER -->

    <header class="header">

      <button
        class="menu-btn"
        id="menuBtn"
      >

        ☰

      </button>



      <div class="logo">

        RIGO AI

      </div>



      <button
        class="language-btn"
        id="languageBtn"
      >

        EN

      </button>

    </header>



    <!-- CHAT AREA -->

    <section
      class="chat-container"
      id="chatContainer"
    >

    </section>



    <!-- INPUT AREA -->

    <footer class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك هنا..."
        autocomplete="off"
      />



      <button
        id="sendBtn"
      >

        إرسال

      </button>

    </footer>

  </main>



  <!-- SHARED -->

  <script src="js/shared/utils.js"></script>



  <!-- CHAT -->

  <script src="js/chat/chat-state.js"></script>

  <script src="js/chat/chat-utils.js"></script>

  <script src="js/chat/chat-elements.js"></script>

  <script src="js/chat/chat-actions.js"></script>

  <script src="js/chat/chat-events.js"></script>



  <!-- TEST SCRIPT -->

  <script>

    document.addEventListener(

      "DOMContentLoaded",

      () => {

        const sendBtn =
        document.getElementById(
          "sendBtn"
        );

        const languageBtn =
        document.getElementById(
          "languageBtn"
        );

        const menuBtn =
        document.getElementById(
          "menuBtn"
        );



        if(sendBtn){

          sendBtn.onclick =
          () => {

            alert(
              "SEND WORKING"
            );

          };

        }



        if(languageBtn){

          languageBtn.onclick =
          () => {

            alert(
              "LANGUAGE WORKING"
            );

          };

        }



        if(menuBtn){

          menuBtn.onclick =
          () => {

            alert(
              "MENU WORKING"
            );

          };

        }

      }

    );

  </script>

</body>

</html>
