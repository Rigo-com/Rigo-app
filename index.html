<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>RIGO AI</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#e8e6e1;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid rgba(0,0,0,0.08);
  background:#e8e6e1;
  position:relative;
}

.logo{
  width:120px;
  margin-bottom:10px;
}

header h1{
  color:#28c78f;
  font-size:36px;
  font-weight:bold;
}

.lang-btn{
  position:absolute;
  top:20px;
  left:20px;
  background:#28c78f;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  padding-bottom:120px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.message{
  max-width:75%;
  padding:18px;
  border-radius:22px;
  font-size:18px;
  line-height:1.8;
  word-wrap:break-word;
  animation:fadeIn 0.25s ease;
}

.ai{
  background:white;
  color:#28c78f;
  align-self:flex-start;
  border:1px solid rgba(0,0,0,0.06);
}

.user{
  background:#28c78f;
  color:white;
  align-self:flex-end;
}

.input-area{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  gap:10px;
  padding:16px;
  background:#e8e6e1;
  border-top:1px solid rgba(0,0,0,0.08);
}

input{
  flex:1;
  padding:16px;
  border:none;
  border-radius:18px;
  font-size:18px;
  outline:none;
  background:white;
  color:#28c78f;
  border:1px solid rgba(0,0,0,0.08);
}

input::placeholder{
  color:#67cfa9;
}

button{
  padding:16px 24px;
  border:none;
  border-radius:18px;
  background:#28c78f;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.typing{
  opacity:0.7;
  font-style:italic;
}

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

</style>
</head>

<body>

<header>

<button class="lang-btn" onclick="toggleLanguage()">
EN
</button>

<img
src="https://i.imgur.com/8Km9tLL.png"
class="logo"
/>

<h1 id="title">RIGO AI</h1>

</header>

<div class="chat" id="chat">

  <div class="message ai" id="welcomeMessage">
    مرحباً 👋 <br><br>
    أنا مساعدك الذكي الشخصي.
  </div>

</div>

<div class="input-area">

  <input
    type="text"
    id="input"
    placeholder="اكتب رسالتك هنا..."
  />

  <button id="sendBtn">
    إرسال
  </button>

</div>

<script>

let currentLanguage = "ar";

const input = document.getElementById("input");
const button = document.getElementById("sendBtn");
const chat = document.getElementById("chat");
const welcomeMessage = document.getElementById("welcomeMessage");

function toggleLanguage(){

  if(currentLanguage === "ar"){

    currentLanguage = "en";

    document.documentElement.lang = "en";
    document.documentElement.dir = "ltr";

    input.placeholder = "Type your message...";
    button.innerText = "Send";

    welcomeMessage.innerHTML =
    "Hello 👋 <br><br> I'm your personal AI assistant.";

    document.querySelector(".lang-btn").innerText = "AR";

  }

  else{

    currentLanguage = "ar";

    document.documentElement.lang = "ar";
    document.documentElement.dir = "rtl";

    input.placeholder = "اكتب رسالتك هنا...";
    button.innerText = "إرسال";

    welcomeMessage.innerHTML =
    "مرحباً 👋 <br><br> أنا مساعدك الذكي الشخصي.";

    document.querySelector(".lang-btn").innerText = "EN";

  }

}

function addMessage(text, type){

  const msg = document.createElement("div");

  msg.className = "message " + type;

  msg.innerText = text;

  chat.appendChild(msg);

  chat.scrollTop = chat.scrollHeight;

}

function showTyping(){

  const typing = document.createElement("div");

  typing.className = "message ai typing";

  typing.id = "typing";

  typing.innerText =
  currentLanguage === "ar"
  ? "RIGO AI يكتب..."
  : "RIGO AI is typing...";

  chat.appendChild(typing);

  chat.scrollTop = chat.scrollHeight;

}

function removeTyping(){

  const typing = document.getElementById("typing");

  if(typing){
    typing.remove();
  }

}

function aiReply(userText){

  let reply = "";

  const text = userText.toLowerCase();

  showTyping();

  setTimeout(() => {

    removeTyping();

    if(currentLanguage === "ar"){

      if(
        text.includes("مرحبا") ||
        text.includes("هلا") ||
        text.includes("السلام")
      ){

        reply = "أهلاً 👋 شلونك؟";

      }

      else if(
        text.includes("شلونك") ||
        text.includes("كيفك")
      ){

        reply = "تمام 😄 وانت شلونك؟";

      }

      else if(
        text.includes("اسمك")
      ){

        reply = "أنا RIGO AI مساعدك الذكي.";

      }

      else if(
        text.includes("تنظيم")
      ){

        reply = "أكيد 👍 أگدر أساعدك بتنظيم يومك ومهامك.";

      }

      else if(
        text.includes("باي")
      ){

        reply = "مع السلامة 👋";

      }

      else{

        reply = "فهمت عليك 👍 كتبت: " + userText;

      }

    }

    else{

      if(
        text.includes("hello") ||
        text.includes("hi")
      ){

        reply = "Hello 👋 How are you?";

      }

      else if(
        text.includes("your name")
      ){

        reply = "I am RIGO AI.";

      }

      else if(
        text.includes("bye")
      ){

        reply = "Goodbye 👋";

      }

      else{

        reply = "I understand 👍 You wrote: " + userText;

      }

    }

    addMessage(reply,"ai");

  },1000);

}

function sendMessage(){

  const text = input.value.trim();

  if(text === "") return;

  addMessage(text,"user");

  input.value = "";

  aiReply(text);

}

button.addEventListener("click", sendMessage);

input.addEventListener("keypress", function(e){

  if(e.key === "Enter"){
    sendMessage();
  }

});

</script>

</body>
</html>
