<!DOCTYPE html>
<html lang="ar">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#071321"
  />

  <title>RIGO AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body dir="rtl">

  <!-- SIDEBAR OVERLAY -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>



  <!-- LOADING SCREEN -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >

    <div class="loader"></div>

    <h1>
      RIGO AI
    </h1>

  </div>



  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <h2>
        RIGO AI
      </h2>



      <button
        id="closeSidebar"
      >

        ✕

      </button>

    </div>



    <button
      class="new-chat-btn"
      id="newChatBtn"
    >

      + New Chat

    </button>



    <div
      class="chat-history"
      id="chatHistory"
    >

      <!-- Chats Here -->

    </div>

  </aside>



  <!-- MAIN -->

  <main class="main">

    <!-- HEADER -->

    <header class="header">

      <button
        class="menu-btn"
        id="menuBtn"
      >

        ☰

      </button>



      <div class="logo">

        RIGO AI

      </div>



      <button
        class="language-btn"
        id="languageBtn"
      >

        EN

      </button>

    </header>



    <!-- CHAT AREA -->

    <section
      class="chat-container"
      id="chatContainer"
    >

      <!-- Messages Here -->

    </section>



    <!-- INPUT AREA -->

    <footer class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك هنا..."
        autocomplete="off"
      />



      <button
        id="sendBtn"
      >

        إرسال

      </button>

    </footer>

  </main>



  <!-- ================================= -->
  <!-- RIGO AI JAVASCRIPT -->
  <!-- ================================= -->



  <!-- SHARED -->

  <script src="js/shared/utils.js"></script>



  <!-- CHAT -->

  <script src="js/chat/chat-state.js"></script>

  <script src="js/chat/chat-stream-state.js"></script>

  <script src="js/chat/chat-utils.js"></script>

  <script src="js/chat/chat-elements.js"></script>

  <script src="js/chat/chat-events.js"></script>

  <script src="js/chat/chat-markdown-renderer.js"></script>

  <script src="js/chat/chat-message-elements.js"></script>

  <script src="js/chat/chat-renderer.js"></script>

  <script src="js/chat/chat-stream-manager.js"></script>

  <script src="js/chat/chat-actions.js"></script>

  <script src="js/chat/chat-queue.js"></script>

  <script src="js/chat/chat-runtime.js"></script>

  <script src="js/chat/index.js"></script>



  <!-- VOICE -->

  <script src="js/voice/voice.js"></script>



  <!-- CORE -->

  <script src="js/core/app.js"></script>

</body>

</html>
