<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RIGO AI</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{

  background:
  radial-gradient(circle at top,#102038 0%,#07111f 45%,#040b14 100%);

  color:white;

  height:100vh;

  overflow:hidden;

  display:flex;

  flex-direction:column;

}

/* HEADER */

header{

  padding:24px 20px;

  text-align:center;

  border-bottom:1px solid rgba(255,255,255,0.05);

  backdrop-filter:blur(12px);

  background:rgba(7,17,31,0.7);

  position:relative;

}

header h1{

  font-size:42px;

  font-weight:900;

  letter-spacing:2px;

  color:#35e0a1;

  text-shadow:0 0 25px rgba(53,224,161,0.25);

}

.subtitle{

  margin-top:8px;

  color:#7d92a8;

  font-size:14px;

  letter-spacing:1px;

}

.lang-btn{

  position:absolute;

  top:22px;

  left:18px;

  border:none;

  background:rgba(53,224,161,0.12);

  border:1px solid rgba(53,224,161,0.35);

  color:#35e0a1;

  font-weight:bold;

  padding:10px 16px;

  border-radius:14px;

  cursor:pointer;

  transition:0.2s;

}

.lang-btn:hover{

  transform:scale(1.05);

}

/* CHAT */

.chat{

  flex:1;

  overflow-y:auto;

  padding:22px;

  display:flex;

  flex-direction:column;

  gap:18px;

  padding-bottom:130px;

}

.chat::-webkit-scrollbar{

  width:4px;

}

.chat::-webkit-scrollbar-thumb{

  background:#35e0a1;

  border-radius:20px;

}

.message{

  max-width:78%;

  padding:18px 20px;

  border-radius:24px;

  line-height:1.9;

  font-size:18px;

  animation:fade .25s ease;

  word-wrap:break-word;

}

.ai{

  align-self:flex-start;

  background:rgba(255,255,255,0.05);

  border:1px solid rgba(255,255,255,0.06);

  backdrop-filter:blur(10px);

  color:white;

  border-top-right-radius:8px;

  box-shadow:
  0 0 15px rgba(0,0,0,0.2);

}

.user{

  align-self:flex-end;

  background:#35e0a1;

  color:#07111f;

  font-weight:bold;

  border-top-left-radius:8px;

  box-shadow:
  0 0 20px rgba(53,224,161,0.25);

}

.typing{

  opacity:.7;

  font-style:italic;

}

/* INPUT */

.input-area{

  position:fixed;

  bottom:0;

  left:0;

  width:100%;

  display:flex;

  gap:12px;

  padding:16px;

  background:rgba(4,11,20,0.92);

  backdrop-filter:blur(12px);

  border-top:1px solid rgba(255,255,255,0.05);

}

input{

  flex:1;

  border:none;

  outline:none;

  background:#101c2d;

  color:white;

  padding:18px;

  border-radius:18px;

  font-size:17px;

  border:1px solid rgba(255,255,255,0.05);

}

input:focus{

  border:1px solid rgba(53,224,161,0.4);

  box-shadow:0 0 15px rgba(53,224,161,0.12);

}

input::placeholder{

  color:#71839a;

}

button.send{

  border:none;

  background:#35e0a1;

  color:#07111f;

  font-weight:900;

  padding:0 24px;

  border-radius:18px;

  cursor:pointer;

  font-size:16px;

  transition:0.2s;

}

button.send:hover{

  transform:scale(1.05);

  box-shadow:0 0 20px rgba(53,224,161,0.35);

}

@keyframes fade{

  from{

    opacity:0;

    transform:translateY(10px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}

</style>

</head>

<body>

<header>

<button class="lang-btn" onclick="toggleLanguage()">
EN
</button>

<h1>
RIGO AI
</h1>

<div class="subtitle" id="subtitle">
SMART PERSONAL ASSISTANT
</div>

</header>

<div class="chat" id="chat">

<div class="message ai" id="welcomeMessage">

مرحباً 👋

<br><br>

أنا مساعدك الذكي الشخصي.
كيف أقدر أساعدك اليوم؟

</div>

</div>

<div class="input-area">

<input
type="text"
id="input"
placeholder="اكتب رسالتك هنا..."
>

<button class="send" id="sendBtn">

إرسال

</button>

</div>

<script>

let currentLanguage = "ar";

const input = document.getElementById("input");

const button = document.getElementById("sendBtn");

const chat = document.getElementById("chat");

const welcomeMessage = document.getElementById("welcomeMessage");

const subtitle = document.getElementById("subtitle");

function toggleLanguage(){

  if(currentLanguage === "ar"){

    currentLanguage = "en";

    document.documentElement.lang = "en";

    document.documentElement.dir = "ltr";

    input.placeholder = "Type your message...";

    button.innerText = "Send";

    subtitle.innerText = "SMART PERSONAL ASSISTANT";

    welcomeMessage.innerHTML =
    "Hello 👋 <br><br> I'm your personal AI assistant. How can I help you today?";

    document.querySelector(".lang-btn").innerText = "AR";

  }

  else{

    currentLanguage = "ar";

    document.documentElement.lang = "ar";

    document.documentElement.dir = "rtl";

    input.placeholder = "اكتب رسالتك هنا...";

    button.innerText = "إرسال";

    subtitle.innerText = "مساعد ذكي شخصي";

    welcomeMessage.innerHTML =
    "مرحباً 👋 <br><br> أنا مساعدك الذكي الشخصي. كيف أقدر أساعدك اليوم؟";

    document.querySelector(".lang-btn").innerText = "EN";

  }

}

function addMessage(text,type){

  const msg = document.createElement("div");

  msg.className = "message " + type;

  msg.innerText = text;

  chat.appendChild(msg);

  chat.scrollTop = chat.scrollHeight;

}

function showTyping(){

  const typing = document.createElement("div");

  typing.className = "message ai typing";

  typing.id = "typing";

  typing.innerText =
  currentLanguage === "ar"
  ? "RIGO AI يكتب..."
  : "RIGO AI is typing...";

  chat.appendChild(typing);

  chat.scrollTop = chat.scrollHeight;

}

function removeTyping(){

  const typing = document.getElementById("typing");

  if(typing){

    typing.remove();

  }

}

function aiReply(userText){

  const text = userText.toLowerCase();

  let reply = "";

  showTyping();

  setTimeout(() => {

    removeTyping();

    if(currentLanguage === "ar"){

      if(
        text.includes("مرحبا") ||
        text.includes("هلا")
      ){

        reply = "أهلاً 👋 شلونك؟";

      }

      else if(
        text.includes("شلونك")
      ){

        reply = "تمام 😄 وانت؟";

      }

      else if(
        text.includes("اسمك")
      ){

        reply = "أنا RIGO AI 🤖";

      }

      else{

        reply = "فهمت عليك 👍\n\nكتبت:\n" + userText;

      }

    }

    else{

      if(
        text.includes("hello") ||
        text.includes("hi")
      ){

        reply = "Hello 👋 How are you?";

      }

      else if(
        text.includes("your name")
      ){

        reply = "I'm RIGO AI 🤖";

      }

      else{

        reply = "I understand 👍\n\nYou wrote:\n" + userText;

      }

    }

    addMessage(reply,"ai");

  },900);

}

function sendMessage(){

  const text = input.value.trim();

  if(text === "") return;

  addMessage(text,"user");

  input.value = "";

  aiReply(text);

}

button.addEventListener("click",sendMessage);

input.addEventListener("keypress",function(e){

  if(e.key === "Enter"){

    sendMessage();

  }

});

</script>

</body>

</html>
