<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>RIGO AI</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{

  height:100vh;

  overflow:hidden;

  background:
  radial-gradient(circle at top,#10243f 0%,#071321 45%,#020812 100%);

  color:white;

  display:flex;

  flex-direction:column;

}

/* HEADER */

header{

  position:relative;

  padding:24px 20px 18px;

  text-align:center;

  border-bottom:1px solid rgba(255,255,255,0.05);

  background:rgba(4,12,22,0.82);

  backdrop-filter:blur(5px);

}

.logo{

  font-size:42px;

  font-weight:900;

  color:#42e4ab;

  letter-spacing:2px;

}

.subtitle{

  margin-top:6px;

  color:#7f93ac;

  font-size:13px;

  letter-spacing:2px;

}

/* LANGUAGE BUTTON */

.lang-btn{

  position:absolute;

  top:18px;

  left:18px;

  width:52px;

  height:52px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(135deg,#42e4ab,#27c98b);

  color:#04101d;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
  0 0 14px rgba(66,228,171,0.22);

}

/* CHAT */

.chat{

  flex:1;

  overflow-y:auto;

  padding:20px 16px 120px;

  display:flex;

  flex-direction:column;

  gap:16px;

}

.chat::-webkit-scrollbar{

  width:4px;

}

.chat::-webkit-scrollbar-thumb{

  background:#42e4ab;

  border-radius:20px;

}

/* MESSAGES */

.message{

  max-width:82%;

  padding:16px 18px;

  border-radius:22px;

  line-height:1.8;

  font-size:19px;

  word-break:break-word;

  animation:fade .2s ease;

}

.ai{

  align-self:flex-start;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,0.06),
    rgba(255,255,255,0.03)
  );

  border:1px solid rgba(255,255,255,0.06);

  backdrop-filter:blur(10px);

  color:white;

  border-top-right-radius:8px;

}

.user{

  align-self:flex-end;

  background:
  linear-gradient(
    135deg,
    #42e4ab,
    #2acb8d
  );

  color:#04101d;

  font-weight:bold;

  border-top-left-radius:8px;

}

/* INPUT AREA */

.input-area{

  position:fixed;

  bottom:0;

  left:0;

  width:100%;

  display:flex;

  gap:10px;

  padding:14px;

  background:
  rgba(2,8,18,0.95);

  border-top:1px solid rgba(255,255,255,0.05);

  backdrop-filter:blur(10px);

}

input{

  flex:1;

  border:none;

  outline:none;

  background:#0d1a2b;

  color:white;

  padding:18px;

  border-radius:20px;

  font-size:17px;

  border:1px solid rgba(255,255,255,0.05);

}

input::placeholder{

  color:#70839b;

}

input:focus{

  border:1px solid rgba(66,228,171,0.35);

}

.send-btn{

  border:none;

  min-width:110px;

  border-radius:20px;

  background:
  linear-gradient(
    135deg,
    #42e4ab,
    #2acb8d
  );

  color:#04101d;

  font-size:20px;

  font-weight:900;

  cursor:pointer;

}

.typing{

  opacity:.65;

  font-style:italic;

}

/* ANIMATION */

@keyframes fade{

  from{

    opacity:0;

    transform:translateY(8px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}

</style>

</head>

<body>

<header>

<button
class="lang-btn"
onclick="toggleLanguage()"
id="langBtn"
>

EN

</button>

<div class="logo">
RIGO AI
</div>

<div
class="subtitle"
id="subtitle"
>

SMART PERSONAL ASSISTANT

</div>

</header>

<div
class="chat"
id="chat"
>

<div
class="message ai"
id="welcome"
>

مرحباً 👋

<br><br>

أنا مساعدك الذكي الشخصي.  
كيف أقدر أساعدك اليوم؟

</div>

</div>

<div class="input-area">

<input
type="text"
id="input"
placeholder="اكتب رسالتك هنا..."
>

<button
class="send-btn"
id="sendBtn"
>

إرسال

</button>

</div>

<script>

/* ===== ELEMENTS ===== */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const sendBtn =
document.getElementById("sendBtn");

const langBtn =
document.getElementById("langBtn");

const subtitle =
document.getElementById("subtitle");

const welcome =
document.getElementById("welcome");

/* ===== LANGUAGE ===== */

let currentLanguage = "ar";

function toggleLanguage(){

  if(currentLanguage === "ar"){

    currentLanguage = "en";

    document.documentElement.lang = "en";

    document.documentElement.dir = "ltr";

    langBtn.innerText = "AR";

    subtitle.innerText =
    "SMART PERSONAL ASSISTANT";

    input.placeholder =
    "Type your message here...";

    sendBtn.innerText = "Send";

    welcome.innerHTML =
    "Hello 👋 <br><br> I'm your personal AI assistant. How can I help you today?";

  }

  else{

    currentLanguage = "ar";

    document.documentElement.lang = "ar";

    document.documentElement.dir = "rtl";

    langBtn.innerText = "EN";

    subtitle.innerText =
    "مساعد ذكي شخصي";

    input.placeholder =
    "اكتب رسالتك هنا...";

    sendBtn.innerText = "إرسال";

    welcome.innerHTML =
    "مرحباً 👋 <br><br> أنا مساعدك الذكي الشخصي. كيف أقدر أساعدك اليوم؟";

  }

}

/* ===== ADD MESSAGE ===== */

function addMessage(text,type){

  const message =
  document.createElement("div");

  message.className =
  "message " + type;

  message.innerText = text;

  chat.appendChild(message);

  chat.scrollTop =
  chat.scrollHeight;

}

/* ===== TYPING ===== */

function showTyping(){

  const typing =
  document.createElement("div");

  typing.className =
  "message ai typing";

  typing.id = "typing";

  typing.innerText =
  currentLanguage === "ar"
  ? "RIGO AI يكتب..."
  : "RIGO AI is typing...";

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

}

function removeTyping(){

  const typing =
  document.getElementById("typing");

  if(typing){

    typing.remove();

  }

}

/* ===== AI REPLY ===== */

function aiReply(userText){

  const text =
  userText.toLowerCase();

  let reply = "";

  showTyping();

  setTimeout(() => {

    removeTyping();

    if(currentLanguage === "ar"){

      if(
        text.includes("مرحبا") ||
        text.includes("هلا")
      ){

        reply =
        "أهلاً 👋 شلونك؟";

      }

      else if(
        text.includes("شلونك")
      ){

        reply =
        "تمام 😄 وانت؟";

      }

      else if(
        text.includes("اسمك")
      ){

        reply =
        "أنا RIGO AI 🤖";

      }

      else if(
        text.includes("ساعدني")
      ){

        reply =
        "أكيد 👍 احكيلي شو تحتاج.";

      }

      else{

        reply =
        "فهمت عليك 👍\n\nأنت كتبت:\n" +
        userText;

      }

    }

    else{

      if(
        text.includes("hello") ||
        text.includes("hi")
      ){

        reply =
        "Hello 👋 How are you?";

      }

      else if(
        text.includes("your name")
      ){

        reply =
        "I'm RIGO AI 🤖";

      }

      else{

        reply =
        "I understand 👍\n\nYou wrote:\n" +
        userText;

      }

    }

    addMessage(reply,"ai");

  },700);

}

/* ===== SEND MESSAGE ===== */

function sendMessage(){

  const text =
  input.value.trim();

  if(text === "") return;

  addMessage(text,"user");

  input.value = "";

  aiReply(text);

}

/* ===== EVENTS ===== */

sendBtn.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keypress",
  function(e){

    if(e.key === "Enter"){

      sendMessage();

    }

  }
);

</script>

</body>

</html>
