<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>RIGO AI</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{

  height:100vh;

  overflow:hidden;

  background:
  radial-gradient(circle at top,#10243f 0%,#071321 45%,#020812 100%);

  color:white;

  display:flex;

  flex-direction:column;

}

/* HEADER */

header{

  position:relative;

  padding:28px 20px 20px;

  text-align:center;

  border-bottom:1px solid rgba(255,255,255,0.05);

  background:rgba(5,15,28,0.75);

  backdrop-filter:blur(6px);

}

.logo{

  font-size:58px;

  font-weight:900;

  color:#41e4aa;

  letter-spacing:3px;

  text-shadow:
  0 0 18px rgba(65,228,170,0.35);

}

.subtitle{

  margin-top:8px;

  color:#7f93ac;

  letter-spacing:2px;

  font-size:14px;

}

.lang-btn{

  position:absolute;

  top:20px;

  left:20px;

  width:58px;

  height:58px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(135deg,#41e4aa,#27c98a);

  color:#071321;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
  0 0 18px rgba(65,228,170,0.3);

  transition:0.2s;

}

.lang-btn:hover{

  transform:scale(1.06);

}

/* CHAT AREA */

.chat{

  flex:1;

  overflow-y:auto;

  padding:24px 18px 120px;

  display:flex;

  flex-direction:column;

  gap:16px;

}

.chat::-webkit-scrollbar{

  width:4px;

}

.chat::-webkit-scrollbar-thumb{

  background:#41e4aa;

  border-radius:20px;

}

/* MESSAGES */

.message{

  max-width:82%;

  padding:18px 20px;

  border-radius:24px;

  font-size:20px;

  line-height:1.8;

  animation:fade .25s ease;

  word-break:break-word;

}

.ai{

  align-self:flex-start;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,0.06),
    rgba(255,255,255,0.03)
  );

  border:1px solid rgba(255,255,255,0.06);

  backdrop-filter:blur(12px);

  color:white;

  border-top-right-radius:8px;

  box-shadow:
  0 8px 30px rgba(0,0,0,0.2);

}

.user{

  align-self:flex-end;

  background:
  linear-gradient(
    135deg,
    #41e4aa,
    #29c989
  );

  color:#04101d;

  font-weight:bold;

  border-top-left-radius:8px;

  box-shadow:
  0 0 20px rgba(65,228,170,0.25);

}

.typing{

  opacity:.65;

  font-style:italic;

}

/* INPUT */

.input-area{

  position:fixed;

  bottom:0;

  left:0;

  width:100%;

  display:flex;

  gap:12px;

  padding:16px;

  background:
  rgba(3,10,20,0.95);

  border-top:1px solid rgba(255,255,255,0.05);

  backdrop-filter:blur(12px);

}

input{

  flex:1;

  border:none;

  outline:none;

  background:#0d1a2b;

  color:white;

  padding:18px;

  border-radius:22px;

  font-size:18px;

  border:1px solid rgba(255,255,255,0.05);

}

input::placeholder{

  color:#6f8299;

}

input:focus{

  border:1px solid rgba(65,228,170,0.35);

  box-shadow:
  0 0 18px rgba(65,228,170,0.15);

}

.send-btn{

  border:none;

  min-width:110px;

  border-radius:22px;

  background:
  linear-gradient(135deg,#41e4aa,#28c688);

  color:#04101d;

  font-size:22px;

  font-weight:900;

  cursor:pointer;

  transition:0.2s;

}

.send-btn:hover{

  transform:scale(1.05);

}

@keyframes fade{

  from{

    opacity:0;

    transform:translateY(10px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}

</style>

</head>

<body>

<header>

<button class="lang-btn" onclick="toggleLanguage()">
EN
</button>

<div class="logo">
RIGO AI
</div>

<div class="subtitle" id="subtitle">
SMART PERSONAL ASSISTANT
</div>

</header>

<div class="chat" id="chat">

<div class="message ai" id="welcome">

مرحباً 👋

<br><br>

أنا مساعدك الذكي الشخصي.  
كيف أقدر أساعدك اليوم؟

</div>

</div>

<div class="input-area">

<input
type="text"
id="input"
placeholder="اكتب رسالتك هنا..."
>

<button
class="send-btn"
id="sendBtn"
>

إرسال

</button>

</div>

<script>

let currentLanguage = "ar";

const chat = document.getElementById("chat");

const input = document.getElementById("input");

const sendBtn = document.getElementById("sendBtn");

const subtitle = document.getElementById("subtitle");

const welcome = document.getElementById("welcome");

/* LANGUAGE */

function toggleLanguage(){

  const langBtn =
  document.querySelector(".lang-btn");

  if(currentLanguage === "ar"){

    currentLanguage = "en";

    document.documentElement.lang = "en";

    document.documentElement.dir = "ltr";

    langBtn.innerText = "AR";

    subtitle.innerText =
    "SMART PERSONAL ASSISTANT";

    input.placeholder =
    "Type your message here...";

    sendBtn.innerText = "Send";

    welcome.innerHTML =
    "Hello 👋 <br><br> I'm your personal AI assistant. How can I help you today?";

  }

  else{

    currentLanguage = "ar";

    document.documentElement.lang = "ar";

    document.documentElement.dir = "rtl";

    langBtn.innerText = "EN";

    subtitle.innerText =
    "مساعد ذكي شخصي";

    input.placeholder =
    "اكتب رسالتك هنا...";

    sendBtn.innerText = "إرسال";

    welcome.innerHTML =
    "مرحباً 👋 <br><br> أنا مساعدك الذكي الشخصي. كيف أقدر أساعدك اليوم؟";

  }

}

/* ADD MESSAGE */

function addMessage(text,type){

  const msg =
  document.createElement("div");

  msg.className =
  "message " + type;

  msg.innerText = text;

  chat.appendChild(msg);

  chat.scrollTop =
  chat.scrollHeight;

}

/* TYPING */

function showTyping(){

  const typing =
  document.createElement("div");

  typing.className =
  "message ai typing";

  typing.id = "typing";

  typing.innerText =
  currentLanguage === "ar"
  ? "RIGO AI يكتب..."
  : "RIGO AI is typing...";

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

}

function removeTyping(){

  const typing =
  document.getElementById("typing");

  if(typing){

    typing.remove();

  }

}

/* AI RESPONSE */

function aiReply(userText){

  const text =
  userText.toLowerCase();

  let reply = "";

  showTyping();

  setTimeout(() => {

    removeTyping();

    /* ARABIC */

    if(currentLanguage === "ar"){

      if(
        text.includes("مرحبا") ||
        text.includes("هلا")
      ){

        reply =
        "أهلاً 👋 شلونك؟";

      }

      else if(
        text.includes("شلونك")
      ){

        reply =
        "تمام 😄 وانت؟";

      }

      else if(
        text.includes("اسمك")
      ){

        reply =
        "أنا RIGO AI 🤖";

      }

      else if(
        text.includes("طقس")
      ){

        reply =
        "حالياً ما عندي اتصال مباشر بالطقس 🌤️";

      }

      else if(
        text.includes("ساعدني")
      ){

        reply =
        "أكيد 👍 احكيلي شو تحتاج بالضبط.";

      }

      else{

        reply =
        "فهمت عليك 👍\n\nأنت كتبت:\n" +
        userText;

      }

    }

    /* ENGLISH */

    else{

      if(
        text.includes("hello") ||
        text.includes("hi")
      ){

        reply =
        "Hello 👋 How are you?";

      }

      else if(
        text.includes("your name")
      ){

        reply =
        "I'm RIGO AI 🤖";

      }

      else if(
        text.includes("weather")
      ){

        reply =
        "I don't have live weather connection yet 🌤️";

      }

      else{

        reply =
        "I understand 👍\n\nYou wrote:\n" +
        userText;

      }

    }

    addMessage(reply,"ai");

  },700);

}

/* SEND */

function sendMessage(){

  const text =
  input.value.trim();

  if(text === "") return;

  addMessage(text,"user");

  input.value = "";

  aiReply(text);

}

sendBtn.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keypress",
  function(e){

    if(e.key === "Enter"){

      sendMessage();

    }

  }
);

</script>

</body>

</html>
