<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>RIGO AI</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    .header{
      padding:20px;
      text-align:center;
      border-bottom:1px solid #1e293b;
      font-size:22px;
      font-weight:bold;
    }

    .chat{
      flex:1;
      padding:20px;
      overflow-y:auto;
    }

    .message{
      max-width:80%;
      padding:14px;
      border-radius:16px;
      margin-bottom:14px;
      line-height:1.5;
    }

    .ai{
      background:#1e293b;
    }

    .user{
      background:#22c55e;
      margin-left:auto;
    }

    .input-area{
      display:flex;
      padding:15px;
      border-top:1px solid #1e293b;
      gap:10px;
    }

    input{
      flex:1;
      padding:14px;
      border:none;
      border-radius:14px;
      background:#1e293b;
      color:white;
      font-size:16px;
    }

    button{
      padding:14px 20px;
      border:none;
      border-radius:14px;
      background:#22c55e;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

  </style>

</head>

<body>

  <div class="header">
    RIGO AI
  </div>

  <div class="chat">

    <div class="message ai">
      Hello 👋<br><br>
      I'm your personal AI assistant.
    </div>

    <div class="message user">
      Help me organize my day.
    </div>

  </div>

  <div class="input-area">
    <input type="text" placeholder="Message RIGO AI..." />
    <button>Send</button>
  </div>

</body>

</html>
