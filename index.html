<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>RIGO AI</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{

  height:100vh;

  overflow:hidden;

  background:
  radial-gradient(circle at top,#10243f 0%,#071321 45%,#020812 100%);

  color:white;

  display:flex;

  flex-direction:column;

}

/* SIDEBAR */

.sidebar{

  position:fixed;

  top:0;

  right:-320px;

  width:300px;

  height:100%;

  background:#071321;

  border-left:1px solid rgba(255,255,255,0.05);

  transition:0.25s;

  z-index:1000;

  padding:20px;

  overflow-y:auto;

}

.sidebar.active{

  right:0;

}

.sidebar h2{

  color:#42e4ab;

  margin-bottom:20px;

}

.chat-item{

  background:rgba(255,255,255,0.05);

  padding:14px;

  border-radius:16px;

  margin-bottom:12px;

  cursor:pointer;

  transition:0.2s;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}

.chat-item:hover{

  background:rgba(255,255,255,0.08);

}

.new-chat{

  width:100%;

  padding:14px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #42e4ab,
    #2acb8d
  );

  color:#04101d;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  margin-bottom:20px;

}

/* HEADER */

header{

  position:relative;

  padding:24px 20px 18px;

  text-align:center;

  border-bottom:1px solid rgba(255,255,255,0.05);

  background:rgba(4,12,22,0.82);

  backdrop-filter:blur(5px);

}

.logo{

  font-size:42px;

  font-weight:900;

  color:#42e4ab;

  letter-spacing:2px;

}

.subtitle{

  margin-top:6px;

  color:#7f93ac;

  font-size:13px;

  letter-spacing:2px;

}

/* MENU BUTTON */

.menu-btn{

  position:absolute;

  right:18px;

  top:18px;

  width:52px;

  height:52px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #42e4ab,
    #27c98b
  );

  color:#04101d;

  font-size:24px;

  font-weight:bold;

  cursor:pointer;

}

/* LANGUAGE BUTTON */

.lang-btn{

  position:absolute;

  top:18px;

  left:18px;

  width:52px;

  height:52px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #42e4ab,
    #27c98b
  );

  color:#04101d;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

}

/* CHAT */

.chat{

  flex:1;

  overflow-y:auto;

  padding:20px 16px 120px;

  display:flex;

  flex-direction:column;

  gap:16px;

}

.chat::-webkit-scrollbar{

  width:4px;

}

.chat::-webkit-scrollbar-thumb{

  background:#42e4ab;

  border-radius:20px;

}

/* MESSAGE */

.message{

  max-width:82%;

  padding:16px 18px;

  border-radius:22px;

  line-height:1.8;

  font-size:19px;

  word-break:break-word;

  animation:fade .2s ease;

}

.ai{

  align-self:flex-start;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,0.06),
    rgba(255,255,255,0.03)
  );

  border:1px solid rgba(255,255,255,0.06);

  color:white;

  border-top-right-radius:8px;

}

.user{

  align-self:flex-end;

  background:
  linear-gradient(
    135deg,
    #42e4ab,
    #2acb8d
  );

  color:#04101d;

  font-weight:bold;

  border-top-left-radius:8px;

}

.typing{

  opacity:.65;

  font-style:italic;

}

/* INPUT AREA */

.input-area{

  position:fixed;

  bottom:0;

  left:0;

  width:100%;

  display:flex;

  gap:10px;

  padding:14px;

  background:
  rgba(2,8,18,0.95);

  border-top:1px solid rgba(255,255,255,0.05);

}

input{

  flex:1;

  border:none;

  outline:none;

  background:#0d1a2b;

  color:white;

  padding:18px;

  border-radius:20px;

  font-size:17px;

}

input::placeholder{

  color:#70839b;

}

.send-btn{

  border:none;

  min-width:110px;

  border-radius:20px;

  background:
  linear-gradient(
    135deg,
    #42e4ab,
    #2acb8d
  );

  color:#04101d;

  font-size:20px;

  font-weight:900;

  cursor:pointer;

}

/* ANIMATION */

@keyframes fade{

  from{

    opacity:0;

    transform:translateY(8px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div
class="sidebar"
id="sidebar"
>

<button
class="new-chat"
onclick="newChat()"
>

+ محادثة جديدة

</button>

<h2>
المحادثات
</h2>

<div
id="chatHistory"
>

</div>

</div>

<!-- HEADER -->

<header>

<button
class="menu-btn"
onclick="toggleSidebar()"
>

☰

</button>

<button
class="lang-btn"
onclick="toggleLanguage()"
id="langBtn"
>

EN

</button>

<div class="logo">
RIGO AI
</div>

<div
class="subtitle"
id="subtitle"
>

SMART PERSONAL ASSISTANT

</div>

</header>

<!-- CHAT -->

<div
class="chat"
id="chat"
>

</div>

<!-- INPUT -->

<div class="input-area">

<input
type="text"
id="input"
placeholder="اكتب رسالتك هنا..."
>

<button
class="send-btn"
id="sendBtn"
>

إرسال

</button>

</div>

<script>

/* ELEMENTS */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const sendBtn =
document.getElementById("sendBtn");

const langBtn =
document.getElementById("langBtn");

const subtitle =
document.getElementById("subtitle");

const sidebar =
document.getElementById("sidebar");

const chatHistory =
document.getElementById("chatHistory");

/* LANGUAGE */

let currentLanguage = "ar";

let currentChatTitle = "";

/* FIRST MESSAGE */

function showWelcome(){

  chat.innerHTML = `
  <div class="message ai">

  مرحباً 👋

  <br><br>

  أنا مساعدك الذكي الشخصي.
  كيف أقدر أساعدك اليوم؟

  </div>
  `;

}

showWelcome();

/* SIDEBAR */

function toggleSidebar(){

  sidebar.classList.toggle("active");

}

/* SAVE CHAT */

function saveChat(){

  localStorage.setItem(
    "rigo_current_chat",
    chat.innerHTML
  );

}

/* LOAD CHAT */

function loadChat(){

  const saved =
  localStorage.getItem(
    "rigo_current_chat"
  );

  if(saved){

    chat.innerHTML = saved;

  }

}

/* CREATE CHAT ITEM */

function createChatItem(title,content){

  const item =
  document.createElement("div");

  item.className =
  "chat-item";

  item.innerText = title;

  item.onclick = () => {

    chat.innerHTML = content;

    saveChat();

    sidebar.classList.remove(
      "active"
    );

  };

  chatHistory.prepend(item);

}

/* NEW CHAT */

function newChat(){

  const oldChat =
  chat.innerHTML;

  if(
    oldChat.trim() !== "" &&
    currentChatTitle !== ""
  ){

    createChatItem(
      currentChatTitle,
      oldChat
    );

  }

  currentChatTitle = "";

  showWelcome();

  saveChat();

}

/* ADD MESSAGE */

function addMessage(text,type){

  const message =
  document.createElement("div");

  message.className =
  "message " + type;

  message.innerText = text;

  chat.appendChild(message);

  chat.scrollTop =
  chat.scrollHeight;

  saveChat();

}

/* TYPING */

function showTyping(){

  const typing =
  document.createElement("div");

  typing.className =
  "message ai typing";

  typing.id = "typing";

  typing.innerText =
  currentLanguage === "ar"
  ? "RIGO AI يكتب..."
  : "RIGO AI is typing...";

  chat.appendChild(typing);

}

function removeTyping(){

  const typing =
  document.getElementById("typing");

  if(typing){

    typing.remove();

  }

}

/* AI */

function aiReply(userText){

  showTyping();

  setTimeout(() => {

    removeTyping();

    addMessage(
      currentLanguage === "ar"
      ? "فهمت عليك 👍"
      : "I understand 👍",
      "ai"
    );

  },700);

}

/* SEND */

function sendMessage(){

  const text =
  input.value.trim();

  if(text === "") return;

  if(currentChatTitle === ""){

    currentChatTitle =
    text.length > 30
    ? text.substring(0,30) + "..."
    : text;

  }

  addMessage(text,"user");

  input.value = "";

  aiReply(text);

}

sendBtn.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keypress",
  function(e){

    if(e.key === "Enter"){

      sendMessage();

    }

  }
);

/* LANGUAGE */

function toggleLanguage(){

  if(currentLanguage === "ar"){

    currentLanguage = "en";

    document.documentElement.dir =
    "ltr";

    document.documentElement.lang =
    "en";

    langBtn.innerText = "AR";

    subtitle.innerText =
    "SMART PERSONAL ASSISTANT";

    input.placeholder =
    "Type your message here...";

    sendBtn.innerText =
    "Send";

  }

  else{

    currentLanguage = "ar";

    document.documentElement.dir =
    "rtl";

    document.documentElement.lang =
    "ar";

    langBtn.innerText = "EN";

    subtitle.innerText =
    "مساعد ذكي شخصي";

    input.placeholder =
    "اكتب رسالتك هنا...";

    sendBtn.innerText =
    "إرسال";

  }

}

/* LOAD */

loadChat();

</script>

</body>

</html>
