<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#071321"
  />

  <title>RIGO AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- SIDEBAR OVERLAY -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>



  <!-- LOADING SCREEN -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >

    <div class="loader"></div>

    <h1>
      RIGO AI
    </h1>

  </div>



  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <h2>
        RIGO AI
      </h2>

      <button id="closeSidebar">
        ✕
      </button>

    </div>



    <button
      class="new-chat-btn"
      id="newChatBtn"
    >

      + New Chat

    </button>



    <div
      class="chat-history"
      id="chatHistory"
    ></div>

  </aside>



  <!-- MAIN -->

  <main class="main">

    <!-- HEADER -->

    <header class="header">

      <button
        class="menu-btn"
        id="menuBtn"
      >

        ☰

      </button>



      <div class="logo">
        RIGO AI
      </div>



      <button
        class="language-btn"
        id="languageBtn"
      >

        EN

      </button>

    </header>



    <!-- CHAT -->

    <section
      class="chat-container"
      id="chatContainer"
    ></section>



    <!-- INPUT -->

    <footer class="input-area">

      <textarea
        id="messageInput"
        placeholder="اكتب رسالتك هنا..."
        autocomplete="off"
        spellcheck="false"
        rows="1"
      ></textarea>



      <button id="sendBtn">
        إرسال
      </button>

    </footer>

  </main>



  <!-- ================================= -->
  <!-- SHARED -->
  <!-- ================================= -->

  <script src="js/shared/utils.js"></script>



  <!-- ================================= -->
  <!-- CHAT -->
  <!-- ================================= -->

  <script src="js/chat/chat-state.js"></script>

  <script src="js/chat/chat-stream-state.js"></script>

  <script src="js/chat/chat-utils.js"></script>

  <script src="js/chat/chat-elements.js"></script>

  <script src="js/chat/chat-markdown-renderer.js"></script>

  <script src="js/chat/chat-message-elements.js"></script>

  <script src="js/chat/chat-renderer.js"></script>

  <script src="js/chat/chat-stream-manager.js"></script>

  <script src="js/chat/chat-actions.js"></script>

  <script src="js/chat/chat-queue.js"></script>

  <script src="js/chat/chat-runtime.js"></script>



  <!-- ================================= -->
  <!-- VOICE -->
  <!-- ================================= -->

  <script src="js/voice/voice.js"></script>



  <!-- ================================= -->
  <!-- APP EVENTS -->
  <!-- ================================= -->

  <script>

    window.addEventListener(
      "DOMContentLoaded",
      () => {

        // ============================
        // REMOVE LOADING
        // ============================

        const loadingScreen =
        document.getElementById(
          "loadingScreen"
        );

        if(loadingScreen){

          loadingScreen
          .style.display =
          "none";

        }



        // ============================
        // START CHAT RUNTIME
        // ============================

        if(
          typeof ChatRuntime !==
          "undefined"

          &&

          typeof ChatRuntime.start ===
          "function"
        ){

          ChatRuntime.start();

        }



        // ============================
        // ELEMENTS
        // ============================

        const messageInput =
        document.getElementById(
          "messageInput"
        );

        const sendBtn =
        document.getElementById(
          "sendBtn"
        );

        const languageBtn =
        document.getElementById(
          "languageBtn"
        );



        // ============================
        // AUTO TEXT DIRECTION
        // ============================

        messageInput
        ?.addEventListener(
          "input",
          () => {

            const value =
            messageInput.value.trim();

            const isArabic =

              /[\u0600-\u06FF]/.test(
                value
              );



            // ============================
            // TEXT DIRECTION
            // ============================

            messageInput.style.direction =

              isArabic

              ?

              "rtl"

              :

              "ltr";

            messageInput.style.textAlign =

              isArabic

              ?

              "right"

              :

              "left";



            // ============================
            // AUTO HEIGHT
            // ============================

            messageInput.style.height =
            "58px";

            messageInput.style.height =

              Math.min(
                messageInput.scrollHeight,
                140
              ) + "px";

          }
        );



        // ============================
        // LANGUAGE TOGGLE
        // ============================

        languageBtn
        ?.addEventListener(
          "click",
          () => {

            const currentDir =
            document.documentElement.dir;

            if(
              currentDir === "rtl"
            ){

              document.documentElement.dir =
              "ltr";

              document.documentElement.lang =
              "en";

              messageInput.placeholder =
              "Type your message...";

              messageInput.style.direction =
              "ltr";

              messageInput.style.textAlign =
              "left";

              sendBtn.innerText =
              "Send";

              languageBtn.innerText =
              "AR";

            }

            else{

              document.documentElement.dir =
              "rtl";

              document.documentElement.lang =
              "ar";

              messageInput.placeholder =
              "اكتب رسالتك هنا...";

              messageInput.style.direction =
              "rtl";

              messageInput.style.textAlign =
              "right";

              sendBtn.innerText =
              "إرسال";

              languageBtn.innerText =
              "EN";

            }

          }
        );



        // ============================
        // NEW CHAT
        // ============================

        const newChatBtn =
        document.getElementById(
          "newChatBtn"
        );

        newChatBtn
        ?.addEventListener(
          "click",
          async () => {

            try{

              if(
                typeof ChatRuntime !==
                "undefined"

                &&

                typeof ChatRuntime.reset ===
                "function"
              ){

                await ChatRuntime.reset();

              }

              if(
                typeof ChatRuntime !==
                "undefined"

                &&

                typeof ChatRuntime.start ===
                "function"
              ){

                ChatRuntime.start();

              }

            }

            catch(error){

              console.error(
                "NEW_CHAT_ERROR:",
                error
              );

            }

          }
        );



        // ============================
        // SIDEBAR
        // ============================

        const sidebar =
        document.getElementById(
          "sidebar"
        );

        const sidebarOverlay =
        document.getElementById(
          "sidebarOverlay"
        );

        const menuBtn =
        document.getElementById(
          "menuBtn"
        );

        const closeSidebar =
        document.getElementById(
          "closeSidebar"
        );



        function openSidebar(){

          sidebar?.classList.add(
            "active"
          );

          sidebarOverlay
          ?.classList.add(
            "active"
          );

        }



        function closeSidebarMenu(){

          sidebar?.classList.remove(
            "active"
          );

          sidebarOverlay
          ?.classList.remove(
            "active"
          );

        }



        menuBtn
        ?.addEventListener(
          "click",
          openSidebar
        );



        closeSidebar
        ?.addEventListener(
          "click",
          closeSidebarMenu
        );



        sidebarOverlay
        ?.addEventListener(
          "click",
          closeSidebarMenu
        );

      }
    );

  </script>

</body>

</html>
