<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RIGO AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<!-- SIDEBAR -->

<div
class="sidebar"
id="sidebar"
>

<button
class="new-chat"
onclick="newChat()"
>

+ محادثة جديدة

</button>

<h2>
المحادثات
</h2>

<div
id="chatHistory"
>

</div>

</div>

<!-- HEADER -->

<header>

<button
class="menu-btn"
onclick="toggleSidebar()"
>

☰

</button>

<button
class="lang-btn"
onclick="toggleLanguage()"
id="langBtn"
>

EN

</button>

<div class="logo">
RIGO AI
</div>

<div
class="subtitle"
id="subtitle"
>

SMART PERSONAL ASSISTANT

</div>

</header>

<!-- CHAT -->

<div
class="chat"
id="chat"
>

</div>

<!-- INPUT -->

<div class="input-area">

<input
type="text"
id="input"
placeholder="اكتب رسالتك هنا..."
>

<button
class="send-btn"
id="sendBtn"
>

إرسال

</button>

</div>

<script src="script.js"></script>

</body>

</html>
