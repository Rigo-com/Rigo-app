<!DOCTYPE html>
<html lang="ar">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#071321"
  />

  <title>RIGO AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- SIDEBAR OVERLAY -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>



  <!-- LOADING SCREEN -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >

    <div class="loader"></div>

    <h1>
      RIGO AI
    </h1>

  </div>



  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <h2>
        RIGO AI
      </h2>

      <button id="closeSidebar">
        ✕
      </button>

    </div>



    <button
      class="new-chat-btn"
      id="newChatBtn"
    >

      + New Chat

    </button>



    <div
      class="chat-history"
      id="chatHistory"
    ></div>

  </aside>



  <!-- MAIN -->

  <main class="main">

    <!-- HEADER -->

    <header class="header">

      <button
        class="menu-btn"
        id="menuBtn"
      >

        ☰

      </button>



      <div class="logo">
        RIGO AI
      </div>



      <button
        class="language-btn"
        id="languageBtn"
      >

        EN

      </button>

    </header>



    <!-- CHAT -->

    <section
      class="chat-container"
      id="chatContainer"
    ></section>



    <!-- INPUT -->

    <footer class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك هنا..."
        autocomplete="off"
        dir="auto"
        spellcheck="false"
      />



      <button id="sendBtn">
        إرسال
      </button>

    </footer>

  </main>



  <!-- ================================= -->
  <!-- SHARED -->
  <!-- ================================= -->

  <script src="js/shared/utils.js"></script>



  <!-- ================================= -->
  <!-- CHAT -->
  <!-- ================================= -->

  <script src="js/chat/chat-state.js"></script>

  <script src="js/chat/chat-stream-state.js"></script>

  <script src="js/chat/chat-utils.js"></script>

  <script src="js/chat/chat-elements.js"></script>

  <script src="js/chat/chat-markdown-renderer.js"></script>

  <script src="js/chat/chat-message-elements.js"></script>

  <script src="js/chat/chat-renderer.js"></script>

  <script src="js/chat/chat-stream-manager.js"></script>

  <script src="js/chat/chat-actions.js"></script>

  <script src="js/chat/chat-queue.js"></script>

  <script src="js/chat/chat-runtime.js"></script>



  <!-- ================================= -->
  <!-- DISABLED TEMP -->
  <!-- ================================= -->

  <!--
  <script src="js/chat/chat-events.js"></script>

  <script src="js/chat/index.js"></script>
  -->



  <!-- ================================= -->
  <!-- VOICE -->
  <!-- ================================= -->

  <script src="js/voice/voice.js"></script>



  <!-- ================================= -->
  <!-- APP EVENTS -->
  <!-- ================================= -->

  <script>

    window.addEventListener(
      "DOMContentLoaded",
      () => {

        // ============================
        // REMOVE LOADING
        // ============================

        const loadingScreen =
        document.getElementById(
          "loadingScreen"
        );

        if(loadingScreen){

          loadingScreen
          .style.display =
          "none";

        }



        // ============================
        // ELEMENTS
        // ============================

        const sendBtn =
        document.getElementById(
          "sendBtn"
        );

        const messageInput =
        document.getElementById(
          "messageInput"
        );

        const chatContainer =
        document.getElementById(
          "chatContainer"
        );

        const newChatBtn =
        document.getElementById(
          "newChatBtn"
        );



        // ============================
        // INPUT AUTO DIRECTION
        // ============================

        messageInput?.addEventListener(
          "input",
          () => {

            const value =
            messageInput.value.trim();

            const isArabic =

              /[\u0600-\u06FF]/.test(
                value
              );

            messageInput.style.direction =

              isArabic

              ?

              "rtl"

              :

              "ltr";

            messageInput.style.textAlign =

              isArabic

              ?

              "right"

              :

              "left";

          }
        );



        // ============================
        // DIRECT SEND
        // ============================

        async function handleSend(){

          try{

            const text =
            String(
              messageInput?.value || ""
            )
            .trim();

            if(!text){

              return;

            }



            // ============================
            // USER MESSAGE
            // ============================

            const userWrapper =
            document.createElement(
              "div"
            );

            userWrapper.className =
            "message user-message";



            const userContent =
            document.createElement(
              "div"
            );

            userContent.className =
            "message-content";

            userContent.textContent =
            text;



            userWrapper.appendChild(
              userContent
            );

            chatContainer?.appendChild(
              userWrapper
            );



            // ============================
            // CLEAR INPUT
            // ============================

            messageInput.value =
            "";



            // ============================
            // SCROLL
            // ============================

            chatContainer.scrollTop =
            chatContainer.scrollHeight;



            // ============================
            // TEMP AI RESPONSE
            // ============================

            setTimeout(() => {

              const aiWrapper =
              document.createElement(
                "div"
              );

              aiWrapper.className =
              "message ai-message";



              const aiContent =
              document.createElement(
                "div"
              );

              aiContent.className =
              "message-content";

              aiContent.textContent =
              "RIGO AI RESPONSE";



              aiWrapper.appendChild(
                aiContent
              );

              chatContainer
              ?.appendChild(
                aiWrapper
              );



              chatContainer.scrollTop =
              chatContainer.scrollHeight;

            },500);

          }

          catch(error){

            console.error(
              "DIRECT_SEND_ERROR:",
              error
            );

          }

        }



        // ============================
        // SEND BUTTON
        // ============================

        sendBtn
        ?.addEventListener(
          "click",
          handleSend
        );



        // ============================
        // ENTER KEY
        // ============================

        messageInput
        ?.addEventListener(
          "keydown",
          (event) => {

            if(
              event.key === "Enter"
            ){

              event.preventDefault();

              handleSend();

            }

          }
        );



        // ============================
        // NEW CHAT
        // ============================

        newChatBtn
        ?.addEventListener(
          "click",
          () => {

            chatContainer.innerHTML =
            "";

          }
        );



        // ============================
        // LANGUAGE BUTTON
        // ============================

        const languageBtn =
        document.getElementById(
          "languageBtn"
        );

        languageBtn
        ?.addEventListener(
          "click",
          () => {

            const isArabic =

              languageBtn.innerText ===
              "EN";

            if(isArabic){

              document.documentElement
              .lang =
              "en";

              messageInput.placeholder =
              "Type your message...";

              languageBtn.innerText =
              "AR";

            }

            else{

              document.documentElement
              .lang =
              "ar";

              messageInput.placeholder =
              "اكتب رسالتك هنا...";

              languageBtn.innerText =
              "EN";

            }

          }
        );



        // ============================
        // SIDEBAR
        // ============================

        const sidebar =
        document.getElementById(
          "sidebar"
        );

        const sidebarOverlay =
        document.getElementById(
          "sidebarOverlay"
        );

        const menuBtn =
        document.getElementById(
          "menuBtn"
        );

        const closeSidebar =
        document.getElementById(
          "closeSidebar"
        );



        function openSidebar(){

          sidebar?.classList.add(
            "active"
          );

          sidebarOverlay
          ?.classList.add(
            "active"
          );

        }



        function closeSidebarMenu(){

          sidebar?.classList.remove(
            "active"
          );

          sidebarOverlay
          ?.classList.remove(
            "active"
          );

        }



        menuBtn
        ?.addEventListener(
          "click",
          openSidebar
        );



        closeSidebar
        ?.addEventListener(
          "click",
          closeSidebarMenu
        );



        sidebarOverlay
        ?.addEventListener(
          "click",
          closeSidebarMenu
        );

      }
    );

  </script>

</body>

</html>
