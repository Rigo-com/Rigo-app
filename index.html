<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>RIGO AI Login</title>

  <link
    rel="stylesheet"
    href="./css/login.css">

</head>

<body>

  <div class="login-screen">

    <div class="login-content">

      <img
        class="logo"
        src="./assets/rigo-logo.PNG"
        alt="RIGO AI">

      <h1 class="title">
        Welcome Back
      </h1>

      <p class="subtitle">
        Sign in to continue
      </p>

      <button class="google-button">
        Continue with Google
      </button>

      <div class="divider"></div>

      <input
        class="input-field"
        type="text"
        placeholder="Email or Phone Number">

      <button class="continue-button">
        Continue
      </button>

    </div>

  </div>

</body>

</html>
