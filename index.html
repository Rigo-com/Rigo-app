<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#071321"
  />

  <title>RIGO AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- OVERLAY -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>



  <!-- LOADING -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >

    <div class="loader"></div>

    <h1>RIGO AI</h1>

  </div>



  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <h2>RIGO AI</h2>

      <button id="closeSidebar">
        ✕
      </button>

    </div>



    <button
      class="new-chat-btn"
      id="newChatBtn"
    >

      + New Chat

    </button>



    <div
      class="chat-history"
      id="chatHistory"
    ></div>

  </aside>



  <!-- MAIN -->

  <main class="main">

    <!-- HEADER -->

    <header class="header">

      <button
        class="menu-btn"
        id="menuBtn"
      >
        ☰
      </button>



      <div class="logo">
        RIGO AI
      </div>



      <button
        class="language-btn"
        id="languageBtn"
      >
        EN
      </button>

    </header>



    <!-- CHAT -->

    <section
      class="chat-container"
      id="chatContainer"
    ></section>



    <!-- INPUT -->

    <footer class="input-area">

      <textarea
        id="messageInput"
        placeholder="اكتب رسالتك هنا..."
        rows="1"
        spellcheck="false"
      ></textarea>



      <button id="sendBtn">
        إرسال
      </button>

    </footer>

  </main>



  <!-- ================================= -->
  <!-- SIMPLE CHAT CORE -->
  <!-- ================================= -->

  <script>

    window.addEventListener(
      "DOMContentLoaded",
      () => {

        // =========================
        // LOADING
        // =========================

        const loadingScreen =
        document.getElementById(
          "loadingScreen"
        );

        if(loadingScreen){

          loadingScreen.style.display =
          "none";

        }



        // =========================
        // ELEMENTS
        // =========================

        const sendBtn =
        document.getElementById(
          "sendBtn"
        );

        const messageInput =
        document.getElementById(
          "messageInput"
        );

        const chatContainer =
        document.getElementById(
          "chatContainer"
        );

        const newChatBtn =
        document.getElementById(
          "newChatBtn"
        );

        const languageBtn =
        document.getElementById(
          "languageBtn"
        );



        // =========================
        // AUTO TEXTAREA
        // =========================

        function updateTextarea(){

          const value =
          messageInput.value;

          const isArabic =

            /[\u0600-\u06FF]/.test(
              value
            );

          messageInput.style.direction =

            isArabic
            ? "rtl"
            : "ltr";

          messageInput.style.textAlign =

            isArabic
            ? "right"
            : "left";

          messageInput.style.height =
          "58px";

          messageInput.style.height =

            Math.min(
              messageInput.scrollHeight,
              140
            ) + "px";

        }

        messageInput.addEventListener(
          "input",
          updateTextarea
        );



        // =========================
        // CREATE MESSAGE
        // =========================

        function createMessage(
          text,
          role
        ){

          const wrapper =
          document.createElement(
            "div"
          );

          wrapper.className =

            role === "user"

            ?

            "message user-message"

            :

            "message ai-message";



          const content =
          document.createElement(
            "div"
          );

          content.className =
          "message-content";

          content.textContent =
          text;

          wrapper.appendChild(
            content
          );

          return wrapper;

        }



        // =========================
        // SEND
        // =========================

        function sendMessage(){

          const text =
          messageInput.value.trim();

          if(!text){

            return;

          }



          // USER MESSAGE

          const userMessage =
          createMessage(
            text,
            "user"
          );

          chatContainer.appendChild(
            userMessage
          );



          // CLEAR INPUT

          messageInput.value = "";

          messageInput.style.height =
          "58px";



          // SCROLL

          chatContainer.scrollTop =
          chatContainer.scrollHeight;



          // TEMP AI

          setTimeout(() => {

            const aiMessage =
            createMessage(
              "RIGO AI RESPONSE",
              "assistant"
            );

            chatContainer.appendChild(
              aiMessage
            );

            chatContainer.scrollTop =
            chatContainer.scrollHeight;

          },500);

        }



        // =========================
        // SEND BUTTON
        // =========================

        sendBtn.addEventListener(
          "click",
          sendMessage
        );



        // =========================
        // ENTER
        // =========================

        messageInput.addEventListener(
          "keydown",
          (event) => {

            if(
              event.key === "Enter"
              &&
              !event.shiftKey
            ){

              event.preventDefault();

              sendMessage();

            }

          }
        );



        // =========================
        // NEW CHAT
        // =========================

        newChatBtn.addEventListener(
          "click",
          () => {

            chatContainer.innerHTML =
            "";

          }
        );



        // =========================
        // LANGUAGE
        // =========================

        languageBtn.addEventListener(
          "click",
          () => {

            const currentDir =
            document.documentElement.dir;

            if(currentDir === "rtl"){

              document.documentElement.dir =
              "ltr";

              document.documentElement.lang =
              "en";

              messageInput.placeholder =
              "Type your message...";

              sendBtn.innerText =
              "Send";

              languageBtn.innerText =
              "AR";

            }

            else{

              document.documentElement.dir =
              "rtl";

              document.documentElement.lang =
              "ar";

              messageInput.placeholder =
              "اكتب رسالتك هنا...";

              sendBtn.innerText =
              "إرسال";

              languageBtn.innerText =
              "EN";

            }

          }
        );



        // =========================
        // SIDEBAR
        // =========================

        const sidebar =
        document.getElementById(
          "sidebar"
        );

        const sidebarOverlay =
        document.getElementById(
          "sidebarOverlay"
        );

        const menuBtn =
        document.getElementById(
          "menuBtn"
        );

        const closeSidebar =
        document.getElementById(
          "closeSidebar"
        );



        function openSidebar(){

          sidebar.classList.add(
            "active"
          );

          sidebarOverlay.classList.add(
            "active"
          );

        }



        function closeSidebarMenu(){

          sidebar.classList.remove(
            "active"
          );

          sidebarOverlay.classList.remove(
            "active"
          );

        }



        menuBtn.addEventListener(
          "click",
          openSidebar
        );

        closeSidebar.addEventListener(
          "click",
          closeSidebarMenu
        );

        sidebarOverlay.addEventListener(
          "click",
          closeSidebarMenu
        );



        // INIT

        updateTextarea();

      }
    );

  </script>

</body>

</html>
