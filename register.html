<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RIGO AI Register</title><link rel="stylesheet" href="./css/register.css"></head>
<body><div class="register-screen"><form class="register-content" id="register-form" novalidate>
<img class="logo" src="./assets/rigo-logo.PNG" alt="RIGO AI"><h1 class="title">Create Account</h1><p class="subtitle">Join RIGO AI</p>
<input id="register-name" class="input-field" type="text" autocomplete="name" placeholder="Full Name">
<input id="register-email" class="input-field" type="email" autocomplete="email" placeholder="Email Address" required>
<div class="password-container"><input id="password" class="input-field" type="password" autocomplete="new-password" placeholder="Password" required><button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button></div>
<div class="password-container"><input id="confirmPassword" class="input-field" type="password" autocomplete="new-password" placeholder="Confirm Password" required><button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">Show</button></div>
<div id="register-error" role="alert" aria-live="polite" style="min-height:20px;color:#ef4444;font-size:14px;text-align:center"></div>
<button id="register-submit" type="submit" class="create-button">Create Account</button><a href="./login.html" class="login-link">Already have an account? Sign In</a>
</form></div>
<script type="module">
import Auth from "./js/auth/index.js";
const form=document.getElementById("register-form"),nameInput=document.getElementById("register-name"),emailInput=document.getElementById("register-email"),passwordInput=document.getElementById("password"),confirmInput=document.getElementById("confirmPassword"),submit=document.getElementById("register-submit"),error=document.getElementById("register-error");
for(const button of document.querySelectorAll(".toggle-password"))button.addEventListener("click",()=>{const input=document.getElementById(button.dataset.target);const visible=input.type==="text";input.type=visible?"password":"text";button.textContent=visible?"Show":"Hide";button.setAttribute("aria-label",visible?"Show password":"Hide password")});
await Auth.initialize();if(Auth.status().authenticated)location.replace("./home.html");
form.addEventListener("submit",async e=>{e.preventDefault();error.textContent="";if(passwordInput.value!==confirmInput.value){error.textContent="Passwords do not match.";return}submit.disabled=true;const success=await Auth.register({name:nameInput.value,email:emailInput.value,password:passwordInput.value});if(success){location.replace("./otp.html?mode=verify&email="+encodeURIComponent(emailInput.value.trim().toLowerCase()));return}error.textContent=Auth.status().error||"Unable to create account.";submit.disabled=false});
</script></body></html>
