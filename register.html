<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIGO AI Register</title>
  <link rel="stylesheet" href="./css/register.css">
</head>
<body>
  <div class="register-screen">
    <form class="register-content" id="register-form" novalidate>
      <img class="logo" src="./assets/rigo-logo.PNG" alt="RIGO AI">

      <h1 class="title">Create Account</h1>
      <p class="subtitle">Join RIGO AI</p>

      <input
        id="register-name"
        class="input-field"
        type="text"
        autocomplete="name"
        placeholder="Full Name">

      <input
        id="register-email"
        class="input-field"
        type="email"
        autocomplete="email"
        placeholder="Email Address"
        required>

      <div class="password-container">
        <input
          id="password"
          class="input-field"
          type="password"
          autocomplete="new-password"
          placeholder="Password"
          required>

        <button
          type="button"
          class="toggle-password"
          onclick="togglePassword('password', this)">
          👁
        </button>
      </div>

      <div class="password-container">
        <input
          id="confirmPassword"
          class="input-field"
          type="password"
          autocomplete="new-password"
          placeholder="Confirm Password"
          required>

        <button
          type="button"
          class="toggle-password"
          onclick="togglePassword('confirmPassword', this)">
          👁
        </button>
      </div>

      <div
        id="register-error"
        role="alert"
        aria-live="polite"
        style="min-height:20px;color:#ef4444;font-size:14px;text-align:center;">
      </div>

      <button
        id="register-submit"
        type="submit"
        class="create-button">
        Create Account
      </button>

      <a href="./login.html" class="login-link">
        Already have an account? Sign In
      </a>
    </form>
  </div>

  <script>
    function togglePassword(inputId, button){
      const input = document.getElementById(inputId);

      if(input.type === "password"){
        input.type = "text";
        button.textContent = "🙈";
      }
      else{
        input.type = "password";
        button.textContent = "👁";
      }
    }
  </script>

  <script type="module">
    import Auth
    from "./js/auth/index.js";

    const form =
    document.getElementById("register-form");

    const emailInput =
    document.getElementById("register-email");

    const passwordInput =
    document.getElementById("password");

    const confirmPasswordInput =
    document.getElementById("confirmPassword");

    const submitButton =
    document.getElementById("register-submit");

    const errorElement =
    document.getElementById("register-error");

    await Auth.initialize();

    if(
      Auth.status()
      .authenticated
    ){
      window.location.replace("./home.html");
    }

    form.addEventListener(
      "submit",
      async function(event){
        event.preventDefault();

        errorElement.textContent = "";

        if(
          passwordInput.value !==
          confirmPasswordInput.value
        ){
          errorElement.textContent =
          "Passwords do not match.";
          return;
        }

        submitButton.disabled = true;

        const success =
        await Auth.register({
          email:emailInput.value,
          password:passwordInput.value
        });

        if(success){
          window.location.replace("./home.html");
          return;
        }

        const status =
        Auth.status();

        errorElement.textContent =
        status.error ||
        "Unable to create account.";

        submitButton.disabled = false;
      }
    );
  </script>
</body>
</html>
