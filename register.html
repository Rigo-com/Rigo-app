<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>RIGO AI Register</title>

  <link
    rel="stylesheet"
    href="./css/register.css">

</head>

<body>

  <div class="register-screen">

    <div class="register-content">

      <img
        class="logo"
        src="./assets/rigo-logo.PNG"
        alt="RIGO AI">

      <h1 class="title">
        Create Account
      </h1>

      <p class="subtitle">
        Join RIGO AI
      </p>

      <input
        class="input-field"
        type="text"
        placeholder="Full Name">

      <input
        class="input-field"
        type="email"
        placeholder="Email Address">

      <div class="password-container">

        <input
          id="password"
          class="input-field"
          type="password"
          placeholder="Password">

        <button
          type="button"
          class="toggle-password"
          onclick="togglePassword('password', this)">
          👁
        </button>

      </div>

      <div class="password-container">

        <input
          id="confirmPassword"
          class="input-field"
          type="password"
          placeholder="Confirm Password">

        <button
          type="button"
          class="toggle-password"
          onclick="togglePassword('confirmPassword', this)">
          👁
        </button>

      </div>

      <button
        class="create-button">
        Create Account
      </button>

      <a
        href="./login.html"
        class="login-link">
        Already have an account? Sign In
      </a>

    </div>

  </div>

  <script>

    function togglePassword(
      inputId,
      button
    ){

      const input =
      document.getElementById(
        inputId
      );

      if(
        input.type === "password"
      ){

        input.type = "text";

        button.textContent =
        "🙈";

      }
      else{

        input.type =
        "password";

        button.textContent =
        "👁";

      }

    }

  </script>

</body>

</html>
