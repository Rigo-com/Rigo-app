name: RIGO Bootstrap Runtime

on:
  push:
    branches:
      - ai-bootstrap-wiring
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bootstrap-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check lifecycle syntax
        run: |
          node --check js/bootstrap/bootstrap-lifecycle.js
          node --check js/core/runtime/runtime-manager.js
          node --check js/core/modules/module-runtime.js

      - name: Verify Bootstrap runtime
        run: node tests/bootstrap-runtime.test.mjs
