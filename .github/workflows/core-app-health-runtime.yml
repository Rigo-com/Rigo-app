name: Core Runtime

on:
  push:
    branches: [main]
    paths:
      - "js/core/**"
      - "tests/core-app-health-runtime.test.mjs"
      - ".github/workflows/core-app-health-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "js/core/**"
      - "tests/core-app-health-runtime.test.mjs"
      - ".github/workflows/core-app-health-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js/core -type f -name '*.js' -print0)
      - name: Runtime checks
        run: node tests/core-app-health-runtime.test.mjs
