name: Communication Runtime

on:
  push:
    branches:
      - main
    paths:
      - "js/communication/**"
      - "js/api/api-request.js"
      - "tests/communication-runtime.test.mjs"
      - ".github/workflows/communication-runtime.yml"
  pull_request:
    branches:
      - main
    paths:
      - "js/communication/**"
      - "js/api/api-request.js"
      - "tests/communication-runtime.test.mjs"
      - ".github/workflows/communication-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax checks
        run: |
          for file in js/communication/*.js; do node --check "$file"; done
          node --check js/api/api-request.js

      - name: Runtime checks
        run: node tests/communication-runtime.test.mjs
