name: RIGO AI Layer Runtime

on:
  push:
    branches:
      - ai-bootstrap-wiring
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ai-layer-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check AI Layer syntax
        run: find js/ai -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify AI Layer runtime
        run: node tests/ai-layer-runtime.test.mjs
