name: RIGO Context Manager Runtime

on:
  push:
    branches:
      - ai-bootstrap-wiring
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  context-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Context Manager syntax
        run: find js/ai/context -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify Context Manager runtime
        run: node tests/context-manager-runtime.test.mjs
