name: Storage Runtime

on:
  push:
    branches: [ai-bootstrap-wiring]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check js/storage/storage-engine.js
          node --check js/storage/storage-runtime.js
      - name: Runtime checks
        run: node tests/storage-runtime.test.mjs
