name: Search Runtime

on:
  push:
    branches: [ai-bootstrap-wiring]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check js/search/index.js
          node --check js/search/search-core.js
          node --check js/search/search-engine.js
          node --check js/core/modules/module-setup.js
      - name: Runtime checks
        run: node tests/search-runtime.test.mjs
