name: RIGO AI Integration

on:
  push:
    branches:
      - ai-bootstrap-wiring
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ai-architecture-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check AI modules
        shell: bash
        run: |
          set -euo pipefail
          find js/ai -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Verify AI architecture wiring
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const read = path => fs.readFileSync(path, 'utf8');

          const ai = read('js/ai/index.js');
          const router = read('js/ai/ai-kernel/kernel-router.js');
          const planner = read('js/ai/planner-engine/planner-executor.js');
          const plan = read('js/ai/planner-engine/planner-plan.js');
          const selection = read('js/ai/planner-engine/planner-selection.js');
          const workflow = read('js/ai/workflow-engine/workflow-executor.js');
          const workflowDefinition = read('js/ai/workflow-engine/workflow-workflow.js');
          const agentEvents = read('js/ai/agent/agent-events.js');
          const bootstrapSetup = read('js/bootstrap/bootstrap-setup.js');
          const runtimeBootSequence = read('js/core/runtime/runtime-boot-sequence.js');
          const home = read('home.html');

          assert.match(ai, /AIKernel\.process\s*\(/, 'AI.process must route through AIKernel');
          assert.match(ai, /ToolExecutor\.execute\s*\(/, 'Main AI must execute registered tools through ToolExecutor');
          assert.match(ai, /id:\s*\n\s*WEATHER_TOOL/, 'Weather tool must be registered');
          assert.match(ai, /ContextManager\.register\s*\(/, 'Successful assistant exchanges must enter managed context');
          assert.match(ai, /createConversationNamespace\s*\(/, 'Managed context must use a conversation namespace');

          assert.match(router, /agents\s*\.process\s*\(/, 'Kernel router must route agent requests through AgentManager');
          assert.match(router, /planner\s*\.process\s*\(/, 'Kernel router must route planner requests');
          assert.match(router, /workflows\s*\.process\s*\(/, 'Kernel router must route workflow requests');
          assert.match(router, /tools\s*\.execute\s*\(/, 'Kernel router must route tool requests');

          assert.match(planner, /ServiceManager\.resolve\s*\(\s*["']tools["']\s*\)/, 'Planner must resolve ToolExecutor from ServiceManager');
          assert.match(planner, /ServiceManager\.resolve\s*\(\s*["']agents["']\s*\)/, 'Planner must resolve AgentManager from ServiceManager');
          assert.match(plan, /selectToolsForGoal\s*\(\s*step\.objective\s*\)/, 'Planner must select tools per step');
          assert.match(selection, /طقس/, 'Planner tool selection must support Arabic weather intent');
          assert.match(selection, /weather/, 'Planner tool selection must support English weather intent');

          assert.match(workflow, /ServiceManager\.resolve\s*\(\s*["']tools["']\s*\)/, 'Workflow must resolve ToolExecutor from ServiceManager');
          assert.match(workflow, /ServiceManager\.resolve\s*\(\s*["']agents["']\s*\)/, 'Workflow must resolve AgentManager from ServiceManager');
          assert.match(workflowDefinition, /assignedTool/, 'Workflow definition must preserve assignedTool');
          assert.match(workflowDefinition, /assignedAgent/, 'Workflow definition must preserve assignedAgent');

          assert.match(home, /AI\.process\s*\(/, 'Home chat must use AI.process');
          assert.doesNotMatch(home, /API\.runtime\.(get|post)\s*\(/, 'Home chat must not call backend APIs directly');

          assert.match(bootstrapSetup, /id:\s*["']ai["']/, 'Bootstrap must own the AI system');
          assert.match(bootstrapSetup, /ServiceManager\.register\s*\(\s*["']events["']/, 'Bootstrap must register Core Events as a service');
          assert.match(bootstrapSetup, /initialize:\s*AI\.initialize/, 'Bootstrap must initialize AI');
          assert.match(bootstrapSetup, /shutdown:\s*AI\.shutdown/, 'Bootstrap must shut down AI');
          assert.doesNotMatch(runtimeBootSequence, /from\s+["'][^"']*ai\/index\.js["']/, 'Core runtime must not import AI');
          assert.doesNotMatch(runtimeBootSequence, /AI\.(initialize|shutdown)\s*\(/, 'Core runtime must not own the AI lifecycle');
          assert.doesNotMatch(runtimeBootSequence, /["']ai-system["']/, 'Core runtime must not register a duplicate AI step');
          assert.match(agentEvents, /ServiceManager\.resolve\s*\(\s*["']events["']\s*\)/, 'Agent events must resolve Core Events from ServiceManager');
          assert.doesNotMatch(agentEvents, /\bemitSystemEvent\b/, 'Agent events must not depend on a global emitter');

          console.log('RIGO AI architecture wiring checks passed.');
          EOF

      - name: Verify context isolation and cache invalidation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import ContextManager from './js/ai/context/index.js';

          await ContextManager.initialize();

          await ContextManager.register({
            namespace:'chat:user-a:one',
            type:'session',
            content:{user:'alpha',assistant:'one'}
          });

          await ContextManager.register({
            namespace:'chat:user-b:two',
            type:'session',
            content:{user:'beta',assistant:'two'}
          });

          const first = await ContextManager.buildWindow(
            'alpha',
            {namespace:'chat:user-a:one',maxTokens:4000}
          );

          const isolated = await ContextManager.buildWindow(
            'alpha',
            {namespace:'chat:user-b:two',maxTokens:4000}
          );

          assert.equal(first.contexts.length,1);
          assert.equal(first.contexts[0].content.assistant,'one');
          assert.equal(isolated.contexts.length,1);
          assert.equal(isolated.contexts[0].content.assistant,'two');

          const beforeUpdate = await ContextManager.buildWindow(
            'all-contexts',
            {namespace:'chat:user-a:one',maxTokens:4000}
          );

          assert.equal(beforeUpdate.contexts.length,1);

          await ContextManager.register({
            namespace:'chat:user-a:one',
            type:'session',
            content:{user:'gamma',assistant:'three'}
          });

          const refreshed = await ContextManager.buildWindow(
            'all-contexts',
            {namespace:'chat:user-a:one',maxTokens:4000}
          );

          assert.equal(refreshed.contexts.length,2);

          await ContextManager.shutdown();
          console.log('Context isolation and cache invalidation checks passed.');
          EOF

      - name: Verify indexed context ranking
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import ContextManager from './js/ai/context/index.js';

          await ContextManager.initialize();

          const namespace = 'chat:index:test';

          await ContextManager.register({
            namespace,
            type:'session',
            content:{user:'weather forecast',assistant:'sunny'}
          });

          await ContextManager.register({
            namespace,
            type:'session',
            content:{user:'shopping list',assistant:'milk'}
          });

          await ContextManager.register({
            namespace,
            type:'session',
            content:{user:'طقس أربيل',assistant:'مشمس'}
          });

          const weather = await ContextManager.rank(
            'weather',
            {namespace}
          );

          const arabic = await ContextManager.rank(
            'طقس',
            {namespace}
          );

          const fallback = await ContextManager.rank(
            'unmatched-token',
            {namespace}
          );

          assert.equal(weather.length,1);
          assert.equal(weather[0].content.assistant,'sunny');
          assert.equal(arabic.length,1);
          assert.equal(arabic[0].content.assistant,'مشمس');
          assert.equal(fallback.length,3);

          const diagnostics =
          ContextManager.diagnostics().diagnostics;

          assert.equal(diagnostics.indexSearches,3);
          assert.equal(diagnostics.indexFallbacks,1);
          assert.ok(diagnostics.indexHits >= 2);

          await ContextManager.shutdown();
          console.log('Indexed context ranking checks passed.');
          EOF

      - name: Verify non-destructive context compression
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import ContextManager from './js/ai/context/index.js';

          await ContextManager.initialize();

          const namespace = 'chat:compression:test';
          const originalText =
          `HEAD-${'x'.repeat(12000)}-TAIL`;

          const stored = await ContextManager.register({
            namespace,
            type:'session',
            content:{text:originalText}
          });

          const contextWindow =
          await ContextManager.buildWindow(
            'unmatched',
            {namespace,maxTokens:180}
          );

          assert.equal(contextWindow.contexts.length,1);
          assert.equal(contextWindow.compressedContexts,1);
          assert.ok(contextWindow.totalTokens <= 180);
          assert.equal(
            contextWindow.contexts[0].content.compressed,
            true
          );
          assert.ok(
            contextWindow.contexts[0].content.preview.includes('HEAD')
          );
          assert.ok(
            contextWindow.contexts[0].content.preview.includes('TAIL')
          );

          const storedAfterWindow =
          await ContextManager.rank('unmatched',{namespace});

          assert.equal(
            storedAfterWindow[0].content.text,
            originalText
          );

          const compressed =
          await ContextManager.compress(stored.id,180);

          assert.equal(compressed.content.compressed,true);

          const storedAfterDirectCompression =
          await ContextManager.rank('unmatched',{namespace});

          assert.equal(
            storedAfterDirectCompression[0].content.text,
            originalText
          );

          await ContextManager.shutdown();
          console.log('Non-destructive context compression checks passed.');
          EOF

      - name: Verify context eviction and cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import ContextManager from './js/ai/context/index.js';
          import {
            CONTEXT_MANAGER_CONFIG
          } from './js/ai/context/context-config.js';

          await ContextManager.initialize();

          const namespace = 'chat:eviction:test';
          const now = Date.now();
          const expiredAt =
          now - CONTEXT_MANAGER_CONFIG.MAX_CONTEXT_AGE - 1000;

          await ContextManager.register({
            namespace,
            type:'session',
            content:{text:'expired unique context'},
            createdAt:expiredAt,
            updatedAt:expiredAt
          });

          const fresh = await ContextManager.register({
            namespace,
            type:'session',
            content:{text:'fresh context'}
          });

          const cached = await ContextManager.buildWindow(
            'unmatched',
            {namespace,maxTokens:4000}
          );

          assert.equal(cached.contexts.length,2);
          assert.equal(ContextManager.diagnostics().cache,1);

          const evicted =
          await ContextManager.evictExpired(now);

          assert.equal(evicted,1);

          const afterEviction =
          ContextManager.diagnostics();

          assert.equal(afterEviction.contexts,1);
          assert.equal(afterEviction.cache,0);
          assert.equal(afterEviction.diagnostics.evicted,1);
          assert.equal(afterEviction.diagnostics.removed,1);

          const remaining =
          await ContextManager.rank('unmatched',{namespace});

          assert.equal(remaining.length,1);
          assert.equal(remaining[0].id,fresh.id);

          const registeredAgain =
          await ContextManager.register({
            namespace,
            type:'session',
            content:{text:'expired unique context'}
          });

          assert.ok(registeredAgain);

          await ContextManager.remove(registeredAgain.id);
          assert.equal(
            ContextManager.diagnostics().diagnostics.evicted,
            1
          );

          await ContextManager.reset();

          const reset = ContextManager.diagnostics();
          assert.equal(reset.contexts,0);
          assert.equal(reset.indexes,0);
          assert.equal(reset.cache,0);
          assert.equal(reset.diagnostics.evicted,0);
          assert.equal(reset.diagnostics.removed,0);

          await ContextManager.shutdown();
          console.log('Context eviction and cleanup checks passed.');
          EOF

      - name: Verify atomic context update deduplication
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import ContextManager from './js/ai/context/index.js';

          await ContextManager.initialize();

          const namespace = 'chat:update:test';

          const first = await ContextManager.register({
            namespace,
            type:'session',
            content:{text:'alpha'},
            metadata:{slot:1}
          });

          const second = await ContextManager.register({
            namespace,
            type:'session',
            content:{text:'beta'},
            metadata:{slot:2}
          });

          await ContextManager.buildWindow(
            'alpha',
            {namespace,maxTokens:4000}
          );

          const cacheBefore =
          ContextManager.diagnostics().cache;

          const duplicateUpdate =
          await ContextManager.update(
            second.id,
            {content:{text:'alpha'}}
          );

          assert.equal(duplicateUpdate,false);
          assert.equal(
            ContextManager.diagnostics().cache,
            cacheBefore
          );
          assert.equal(
            ContextManager.diagnostics().diagnostics.duplicates,
            1
          );

          const beta =
          await ContextManager.rank('beta',{namespace});

          assert.equal(beta.length,1);
          assert.equal(beta[0].id,second.id);
          assert.equal(beta[0].content.text,'beta');

          const successful =
          await ContextManager.update(
            second.id,
            {content:{text:'gamma'}}
          );

          assert.equal(successful,true);
          assert.equal(ContextManager.diagnostics().cache,0);

          const gamma =
          await ContextManager.rank('gamma',{namespace});

          assert.equal(gamma.length,1);
          assert.equal(gamma[0].id,second.id);
          assert.equal(gamma[0].createdAt,second.createdAt);
          assert.ok(gamma[0].updatedAt >= second.updatedAt);

          await ContextManager.remove(first.id);

          const reuse =
          await ContextManager.update(
            second.id,
            {content:{text:'alpha'}}
          );

          assert.equal(reuse,true);

          const alpha =
          await ContextManager.rank('alpha',{namespace});

          assert.equal(alpha.length,1);
          assert.equal(alpha[0].id,second.id);

          await ContextManager.shutdown();
          console.log('Atomic context update and deduplication checks passed.');
          EOF

      - name: Verify agent cloning and queue serialization
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import AgentManager from './js/ai/agent/index.js';

          await AgentManager.initialize();

          const order = [];

          const registered = await AgentManager.register({
            id:'queue-test',
            metadata:{nested:{value:1}},
            execute:async ({sequence}) => {
              order.push(`start-${sequence}`);
              await new Promise((resolve) => {
                setTimeout(resolve,25);
              });
              order.push(`end-${sequence}`);
              return {sequence};
            }
          });

          assert.ok(Object.isFrozen(registered.runtime));
          assert.equal(
            AgentManager.get('queue-test').metadata.nested.value,
            1
          );

          const first =
          AgentManager.execute('queue-test',{sequence:1});

          const second =
          AgentManager.execute('queue-test',{sequence:2});

          const [firstResult,secondResult] =
          await Promise.all([first,second]);

          assert.deepEqual(firstResult,{sequence:1});
          assert.deepEqual(secondResult,{sequence:2});
          assert.deepEqual(
            order,
            ['start-1','end-1','start-2','end-2']
          );

          const snapshot = AgentManager.snapshot();
          assert.equal(snapshot.queuedTasks,0);
          assert.equal(snapshot.activeAgents,0);

          const diagnostics =
          AgentManager.diagnostics().diagnostics;

          assert.equal(diagnostics.queued,1);
          assert.equal(diagnostics.tasksExecuted,2);

          await AgentManager.shutdown();
          console.log('Agent cloning and queue serialization checks passed.');
          EOF

      - name: Verify agent event service and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import ServiceManager from './js/services/service-manager.js';
          import AgentManager from './js/ai/agent/index.js';
          import {
            AGENT_EVENTS
          } from './js/ai/agent/agent-constants.js';

          const emitted = [];

          await ServiceManager.register(
            'events',
            async () => ({
              emit:async (name,payload) => {
                emitted.push({name,payload});
                return true;
              }
            })
          );

          await AgentManager.initialize();

          await AgentManager.register({
            id:'event-test',
            execute:async ({sequence}) => {
              await new Promise((resolve) => {
                setTimeout(resolve,15);
              });
              return sequence;
            }
          });

          const first =
          AgentManager.execute('event-test',{sequence:1});

          const second =
          AgentManager.execute('event-test',{sequence:2});

          assert.deepEqual(
            await Promise.all([first,second]),
            [1,2]
          );

          await AgentManager.register({
            id:'failure-test',
            execute:async () => {
              throw new Error('EXPECTED FAILURE');
            }
          });

          await assert.rejects(
            () => AgentManager.execute('failure-test',{}),
            /EXPECTED FAILURE/
          );

          await AgentManager.terminate('event-test');

          const names = emitted.map((event) => event.name);

          assert.ok(names.includes(AGENT_EVENTS.CREATED));
          assert.equal(
            names.filter((name) => name === AGENT_EVENTS.TASK_STARTED).length,
            3
          );
          assert.equal(
            names.filter((name) => name === AGENT_EVENTS.TASK_COMPLETED).length,
            2
          );
          assert.equal(
            names.filter((name) => name === AGENT_EVENTS.TASK_QUEUED).length,
            1
          );
          assert.equal(
            names.filter((name) => name === AGENT_EVENTS.TASK_FAILED).length,
            1
          );
          assert.ok(names.includes(AGENT_EVENTS.TERMINATED));
          assert.ok(
            emitted.every((event) => {
              return event.payload.source === 'agent-manager';
            })
          );

          const diagnostics = AgentManager.diagnostics();
          assert.equal(diagnostics.queuedTasks,0);
          assert.equal(diagnostics.diagnostics.running,3);
          assert.equal(diagnostics.diagnostics.failed,1);
          assert.equal(diagnostics.diagnostics.retries,1);
          assert.equal(diagnostics.diagnostics.eventsFailed,0);
          assert.equal(
            diagnostics.diagnostics.eventsEmitted,
            emitted.length
          );

          await AgentManager.reset();

          const reset = AgentManager.diagnostics().diagnostics;
          assert.ok(
            Object.values(reset).every((value) => value === 0)
          );

          await AgentManager.shutdown();
          console.log('Agent event service and diagnostics checks passed.');
          EOF

      - name: Verify no legacy DependencySystem usage in AI layer
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\bDependency(System)?\b' js/ai; then
            echo 'Legacy dependency architecture detected in js/ai.'
            exit 1
          fi
          echo 'AI layer is clean of legacy Dependency/DependencySystem references.'
