          await ToolExecutor.initialize();

          const secondProcessor =
          toolExecutorState.queueProcessorPromise;

          assert.ok(secondProcessor);
          assert.notEqual(secondProcessor,firstProcessor);

          await ToolExecutor.register({
            id:'quick',
            retries:1,
            execute:async () => true
          });

