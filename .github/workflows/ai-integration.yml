          await import('./js/ai/tools/tool-state.js');
          const {TOOL_EXECUTOR_CONFIG} =
          await import('./js/ai/tools/tool-config.js');

          let failures = 0;

          await ToolExecutor.register({
            id:'breaker',
            retries:1,
            timeout:100,
            execute:async () => {
              failures++;
              throw new Error('BROKEN');
            }
          });

          for(
            let index=0;
            index<TOOL_EXECUTOR_CONFIG.CIRCUIT_BREAKER_THRESHOLD;
            index++
          ){
            const result = await ToolExecutor.execute('breaker');
            assert.equal(result.error.code,'EXECUTION_FAILED');
          }

          assert.equal(
            failures,
            TOOL_EXECUTOR_CONFIG.CIRCUIT_BREAKER_THRESHOLD
          );

          const blocked = await ToolExecutor.execute('breaker');

          assert.equal(blocked.error.code,'CIRCUIT_BLOCKED');
          assert.equal(
            failures,
            TOOL_EXECUTOR_CONFIG.CIRCUIT_BREAKER_THRESHOLD
          );
          assert.equal(
            toolExecutorState.executionHistory.length,
            TOOL_EXECUTOR_CONFIG.CIRCUIT_BREAKER_THRESHOLD
          );
          assert.equal(
            toolExecutorState.tools.get('breaker').runtime.failures,
            TOOL_EXECUTOR_CONFIG.CIRCUIT_BREAKER_THRESHOLD
          );

          toolExecutorState
          .circuitBreakers
          .get('breaker')
          .blockedUntil = Date.now() - 1;

          const recoveredAttempt =
          await ToolExecutor.execute('breaker');

          assert.equal(
            recoveredAttempt.error.code,
            'EXECUTION_FAILED'
          );
          assert.equal(
            failures,
            TOOL_EXECUTOR_CONFIG.CIRCUIT_BREAKER_THRESHOLD + 1
          );

          let executions = 0;

          await ToolExecutor.register({
            id:'toggle',
            retries:1,
            execute:async () => ++executions
          });

          assert.equal(await ToolExecutor.disable('missing'),false);
          assert.equal(await ToolExecutor.enable('missing'),false);
          assert.equal(await ToolExecutor.disable('toggle'),true);
          assert.equal(
            (await ToolExecutor.execute('toggle')).error.code,
            'TOOL_DISABLED'
          );
          assert.equal(executions,0);
          assert.equal(await ToolExecutor.enable('toggle'),true);

          toolExecutorState.executionHistory =
          Array.from(
            {length:TOOL_EXECUTOR_CONFIG.MAX_HISTORY},
            (_,index) => ({index})
          );

          const enabled = await ToolExecutor.execute('toggle');

          assert.equal(enabled.success,true);
          assert.equal(enabled.result,1);
          assert.equal(
            toolExecutorState.executionHistory.length,
            TOOL_EXECUTOR_CONFIG.MAX_HISTORY
          );
          assert.equal(
            toolExecutorState.executionHistory.at(-1).toolId,
            'toggle'
          );
          assert.equal(
            toolExecutorState.tools.get('toggle').runtime.executions,
            1
          );
          assert.ok(
            toolExecutorState.tools.get('toggle').runtime.lastExecutedAt
          );
          assert.ok(toolExecutorState.lastExecutionAt);

          await ToolExecutor.reset();

          console.log(
            'Tool circuit and runtime metadata checks passed.'
          );
          EOF

