            timeout:1000,
            execute:({signal}) => {
              return new Promise((resolve,reject) => {
                signal.addEventListener(
                  'abort',
                  () => reject(new Error('ABORTED')),
                  {once:true}
                );
                setTimeout(() => resolve('late'),100);
              });
            }
          });

          const pending = ToolExecutor.execute('long-running');

          await new Promise((resolve) => setTimeout(resolve,0));

          assert.equal(toolExecutorState.activeExecutions.size,1);

          await ToolExecutor.shutdown();

          const cancelled = await pending;

          assert.equal(cancelled.error.code,'EXECUTION_CANCELLED');
          assert.equal(toolExecutorState.initialized,false);
          assert.equal(toolExecutorState.processing,false);
          assert.equal(toolExecutorState.queueProcessorPromise,null);
          assert.equal(toolExecutorState.activeExecutions.size,0);
