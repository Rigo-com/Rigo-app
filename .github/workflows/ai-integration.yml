            (await ToolExecutor.execute('quick')).success,
            true
          );
          assert.equal(toolExecutorState.diagnostics.executed,1);

          await ToolExecutor.reset();

          assert.equal(toolExecutorState.initialized,true);
          assert.equal(toolExecutorState.processing,true);
          assert.equal(
            toolExecutorState.queueProcessorPromise,
            secondProcessor
          );
          assert.equal(toolExecutorState.tools.size,0);
          assert.equal(toolExecutorState.diagnostics.executed,0);

          await ToolExecutor.register({
            id:'after-reset',
            retries:1,
            execute:async () => true
          });

          assert.equal(
            (await ToolExecutor.execute('after-reset')).success,
            true
          );

          await ToolExecutor.shutdown();

          console.log(
            'Tool lifecycle reset and restart checks passed.'
          );
          EOF

      - name: Verify planner queue runtime controls
