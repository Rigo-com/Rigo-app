          const {PLANNER_ENGINE_CONFIG} =
          await import('./js/ai/planner-engine/planner-config.js');
          const {drainPlannerQueue} =
          await import('./js/ai/planner-engine/planner-queue.js');

          const createPlan = id => ({
            id,
            state:'planned',
            steps:[],
            runtime:{
              running:false,
              controller:null,
              startedAt:null,
              completedAt:null,
              terminatedAt:null
            }
          });

          const queuedPlan = createPlan('queued-plan');
          plannerEngineState.plans.set(queuedPlan.id,queuedPlan);

          for(
            let index=0;
            index<PLANNER_ENGINE_CONFIG.MAX_PARALLEL_PLANS;
            index++
          ){
            plannerEngineState.activePlans.add(`active-${index}`);
          }

          assert.deepEqual(
            await PlannerEngine.execute(queuedPlan.id),
            {queued:true,position:1}
          );
          assert.deepEqual(
            await PlannerEngine.execute(queuedPlan.id),
            {queued:true,duplicate:true}
          );
          assert.equal(plannerEngineState.diagnostics.queued,1);
          assert.equal(plannerEngineState.executionQueue.length,1);

          assert.equal(
            await PlannerEngine.terminate(queuedPlan.id),
            true
          );
          assert.equal(
            plannerEngineState.queuedPlans.has(queuedPlan.id),
            false
          );
          assert.equal(
            plannerEngineState.executionQueue.includes(queuedPlan.id),
            false
          );

          const drainPlan = createPlan('drain-plan');
          plannerEngineState.plans.set(drainPlan.id,drainPlan);

          assert.equal(
            (await PlannerEngine.execute(drainPlan.id)).queued,
            true
          );

          plannerEngineState.activePlans.clear();

          let drainedId = null;

          assert.equal(
            await drainPlannerQueue(async id => {
              drainedId = id;
            }),
            true
          );
          assert.equal(drainedId,drainPlan.id);
          assert.equal(
            plannerEngineState.queuedPlans.has(drainPlan.id),
            false
          );
          assert.equal(plannerEngineState.executionQueue.length,0);

          for(
            let index=0;
            index<PLANNER_ENGINE_CONFIG.MAX_QUEUE_SIZE;
            index++
          ){
            plannerEngineState.executionQueue.push(`full-${index}`);
            plannerEngineState.queuedPlans.add(`full-${index}`);
          }
          for(
            let index=0;
            index<PLANNER_ENGINE_CONFIG.MAX_PARALLEL_PLANS;
            index++
          ){
            plannerEngineState.activePlans.add(`busy-${index}`);
          }

          const overflowPlan = createPlan('overflow-plan');
          plannerEngineState.plans.set(overflowPlan.id,overflowPlan);

          assert.deepEqual(
            await PlannerEngine.execute(overflowPlan.id),
            {queued:false,error:'PLAN_QUEUE_FULL'}
          );
          assert.equal(plannerEngineState.diagnostics.rejected,1);

          await PlannerEngine.reset();

          console.log(
            'Planner queue runtime control checks passed.'
          );
          EOF

      - name: Verify planner retry timeout and abort
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';

          const {default:PlannerEngine} =
          await import('./js/ai/planner-engine/index.js');
          const {default:ServiceManager} =
          await import('./js/services/service-manager.js');
          const {plannerEngineState} =
          await import('./js/ai/planner-engine/planner-state.js');
          const {PLANNER_ENGINE_CONFIG} =
          await import('./js/ai/planner-engine/planner-config.js');
          const {createPlanObject} =
          await import('./js/ai/planner-engine/planner-plan.js');

          let mode = 'retry';
          let attempts = 0;

          await ServiceManager.register(
            'tools',
            async () => ({
              list:async () => [],
              execute:async () => {
                attempts++;
                if(mode === 'retry' && attempts < 3){
                  return {
                    success:false,
                    error:{message:'RETRY'}
                  };
                }
                if(mode === 'slow'){
                  return new Promise((resolve) => {
                    setTimeout(
                      () => resolve({success:true}),
                      100
                    );
                  });
                }
                return {success:true,result:'ok'};
              }
            })
          );
          await ServiceManager.register(
            'events',
            async () => ({emit:async () => true})
          );

          const makePlan = (id,timeout=5000) => ({
            id,
            timeout,
            state:'planned',
            steps:[{
              id:`${id}-step`,
              objective:'test',
              assignedTool:'test-tool',
              assignedAgent:null,
              state:'ready'
            }],
            context:{},
            metadata:{},
            runtime:{
              running:false,
              controller:null,
              startedAt:null,
              completedAt:null,
              terminatedAt:null
            }
          });

          assert.equal(
            createPlanObject({
              id:'bounded',
              goal:'x',
              timeout:PLANNER_ENGINE_CONFIG.PLAN_TIMEOUT * 2
            }).timeout,
            PLANNER_ENGINE_CONFIG.PLAN_TIMEOUT
          );
          assert.equal(
            createPlanObject({
              id:'fallback',
              goal:'x',
              timeout:-1
            }).timeout,
            PLANNER_ENGINE_CONFIG.PLAN_TIMEOUT
          );

          const retryPlan = makePlan('retry-plan');
          plannerEngineState.plans.set(retryPlan.id,retryPlan);

          assert.equal(
            await PlannerEngine.execute(retryPlan.id),
            true
          );
          assert.equal(attempts,3);
          assert.equal(retryPlan.steps[0].retries,2);
          assert.equal(plannerEngineState.diagnostics.replans,2);
          assert.equal(
            plannerEngineState.executionHistory.at(-1).success,
            true
          );

          mode = 'slow';
          attempts = 0;

          const timeoutPlan = makePlan('timeout-plan',10);
          plannerEngineState.plans.set(timeoutPlan.id,timeoutPlan);

          const timeoutStarted = Date.now();

          assert.equal(
            await PlannerEngine.execute(timeoutPlan.id),
            false
          );
          assert.ok(Date.now() - timeoutStarted < 80);
          assert.equal(timeoutPlan.state,'failed');
          assert.match(
            plannerEngineState.executionHistory.at(-1).error,
            /PLAN_TERMINATED/
          );

          const terminatePlan = makePlan('terminate-plan',5000);
          plannerEngineState.plans.set(
            terminatePlan.id,
            terminatePlan
          );

          const pending = PlannerEngine.execute(terminatePlan.id);

          await new Promise((resolve) => setTimeout(resolve,0));

          assert.equal(
            await PlannerEngine.terminate(terminatePlan.id),
            true
          );
          assert.equal(await pending,false);
          assert.ok(terminatePlan.runtime.terminatedAt);

          plannerEngineState.executionHistory =
          Array.from(
            {
              length:
              PLANNER_ENGINE_CONFIG.MAX_EXECUTION_HISTORY
            },
            (_,index) => ({index})
          );

          const historyPlan = {
            ...makePlan('history-plan'),
            steps:[]
          };
          plannerEngineState.plans.set(historyPlan.id,historyPlan);

          assert.equal(
            await PlannerEngine.execute(historyPlan.id),
            true
          );
