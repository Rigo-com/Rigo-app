      - name: Verify tool circuit and runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';

          const {default:ToolExecutor} =
          await import('./js/ai/tools/index.js');
