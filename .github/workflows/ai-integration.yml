name: RIGO AI Integration

on:
  push:
    branches:
      - ai-bootstrap-wiring
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ai-architecture-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check AI modules
        shell: bash
        run: |
          set -euo pipefail
          find js/ai -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Verify AI architecture wiring
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const read = path => fs.readFileSync(path, 'utf8');

          const ai = read('js/ai/index.js');
          const router = read('js/ai/ai-kernel/kernel-router.js');
          const planner = read('js/ai/planner-engine/planner-executor.js');
          const plan = read('js/ai/planner-engine/planner-plan.js');
          const selection = read('js/ai/planner-engine/planner-selection.js');
          const workflow = read('js/ai/workflow-engine/workflow-executor.js');
          const workflowDefinition = read('js/ai/workflow-engine/workflow-workflow.js');
          const agentEvents = read('js/ai/agent/agent-events.js');
          const kernelServices = read('js/ai/ai-kernel/kernel-services.js');
          const moduleSetup = read('js/core/modules/module-setup.js');
          const kernelEvents = read('js/ai/ai-kernel/kernel-events.js');
          const plannerEvents = read('js/ai/planner-engine/planner-events.js');
          const workflowEvents = read('js/ai/workflow-engine/workflow-events.js');
          const toolEvents = read('js/ai/tools/tool-events.js');
          const memoryEvents = read('js/memory/memory-events.js');
          const contextCache = read('js/ai/context/context-cache.js');
          const contextWindow = read('js/ai/context/context-window.js');
          const contextStore = read('js/ai/context/context-store.js');
          const contextState = read('js/ai/context/context-state.js');
          const toolQueue = read('js/ai/tools/tool-queue.js');
          const toolExecutor = read('js/ai/tools/tool-executor.js');
          const toolRegistry = read('js/ai/tools/tool-registry.js');
          const toolUtils = read('js/ai/tools/tool-utils.js');
          const toolCircuitBreaker = read('js/ai/tools/tool-circuit-breaker.js');
          const toolIndex = read('js/ai/tools/tool-index.js');
          const toolLifecycle = read('js/ai/tools/tool-lifecycle.js');
          const toolReset = read('js/ai/tools/tool-reset.js');
          const plannerQueue = read('js/ai/planner-engine/planner-queue.js');
          const plannerRegistry = read('js/ai/planner-engine/planner-registry.js');
          const plannerState = read('js/ai/planner-engine/planner-state.js');
          const plannerDecomposition = read('js/ai/planner-engine/planner-decomposition.js');
          const bootstrapSetup = read('js/bootstrap/bootstrap-setup.js');
          const runtimeBootSequence = read('js/core/runtime/runtime-boot-sequence.js');
          const home = read('home.html');

          assert.match(ai, /AIKernel\.process\s*\(/, 'AI.process must route through AIKernel');
          assert.match(ai, /ToolExecutor\.execute\s*\(/, 'Main AI must execute registered tools through ToolExecutor');
          assert.match(ai, /id:\s*\n\s*WEATHER_TOOL/, 'Weather tool must be registered');
          assert.match(ai, /ContextManager\.register\s*\(/, 'Successful assistant exchanges must enter managed context');
          assert.match(ai, /createConversationNamespace\s*\(/, 'Managed context must use a conversation namespace');
          assert.match(ai, /ServiceManager\.resolve\s*\(\s*["']memory["']\s*\)/, 'Main AI must resolve memory through ServiceManager');
          assert.match(ai, /memory\.search\s*\(/, 'Main AI must retrieve long-term memory');
          assert.match(ai, /memory\.create\s*\(/, 'Main AI must persist successful assistant exchanges');
          assert.match(ai, /memory\.clearContext\?\.\s*\(/, 'Main AI must rebuild the long-term memory working set per request');
          assert.match(ai, /memory\.addContext\?\.\s*\(/, 'Main AI must stage selected long-term memories in MemoryContext');
          assert.match(ai, /memory\.getContext\?\.\s*\(/, 'Main AI must serialize the managed memory working set');
          assert.match(moduleSetup, /ServiceManager\.register\s*\(\s*["']memory["']/, 'Core memory module must publish its service through ServiceManager');
          assert.match(kernelServices, /getAIService\s*\(\s*["']memory["']\s*\)/, 'AI Kernel must validate the memory service');

          assert.match(router, /agents\s*\.process\s*\(/, 'Kernel router must route agent requests through AgentManager');
          assert.match(router, /planner\s*\.process\s*\(/, 'Kernel router must route planner requests');
          assert.match(router, /workflows\s*\.process\s*\(/, 'Kernel router must route workflow requests');
          assert.match(router, /tools\s*\.execute\s*\(/, 'Kernel router must route tool requests');

          assert.match(planner, /ServiceManager\.resolve\s*\(\s*["']tools["']\s*\)/, 'Planner must resolve ToolExecutor from ServiceManager');
          assert.match(planner, /ServiceManager\.resolve\s*\(\s*["']agents["']\s*\)/, 'Planner must resolve AgentManager from ServiceManager');
          assert.match(plan, /selectToolsForGoal\s*\(\s*step\.objective\s*\)/, 'Planner must select tools per step');
          assert.match(selection, /طقس/, 'Planner tool selection must support Arabic weather intent');
          assert.match(selection, /weather/, 'Planner tool selection must support English weather intent');

          assert.match(workflow, /ServiceManager\.resolve\s*\(\s*["']tools["']\s*\)/, 'Workflow must resolve ToolExecutor from ServiceManager');
          assert.match(workflow, /ServiceManager\.resolve\s*\(\s*["']agents["']\s*\)/, 'Workflow must resolve AgentManager from ServiceManager');
          assert.match(workflowDefinition, /assignedTool/, 'Workflow definition must preserve assignedTool');
          assert.match(workflowDefinition, /assignedAgent/, 'Workflow definition must preserve assignedAgent');

          assert.match(home, /AI\.process\s*\(/, 'Home chat must use AI.process');
          assert.doesNotMatch(home, /API\.runtime\.(get|post)\s*\(/, 'Home chat must not call backend APIs directly');

          assert.match(bootstrapSetup, /id:\s*["']ai["']/, 'Bootstrap must own the AI system');
          assert.match(bootstrapSetup, /ServiceManager\.register\s*\(\s*["']events["']/, 'Bootstrap must register Core Events as a service');
          assert.match(bootstrapSetup, /initialize:\s*AI\.initialize/, 'Bootstrap must initialize AI');
          assert.match(bootstrapSetup, /shutdown:\s*AI\.shutdown/, 'Bootstrap must shut down AI');
          assert.doesNotMatch(runtimeBootSequence, /from\s+["'][^"']*ai\/index\.js["']/, 'Core runtime must not import AI');
          assert.doesNotMatch(runtimeBootSequence, /AI\.(initialize|shutdown)\s*\(/, 'Core runtime must not own the AI lifecycle');
          assert.doesNotMatch(runtimeBootSequence, /["']ai-system["']/, 'Core runtime must not register a duplicate AI step');
          assert.match(agentEvents, /ServiceManager\.resolve\s*\(\s*["']events["']\s*\)/, 'Agent events must resolve Core Events from ServiceManager');
          assert.doesNotMatch(agentEvents, /\bemitSystemEvent\b/, 'Agent events must not depend on a global emitter');
          for(const eventModule of [kernelEvents,plannerEvents,workflowEvents,toolEvents]){
            assert.match(eventModule, /ServiceManager\.resolve\s*\(\s*["']events["']\s*\)/, 'AI events must resolve Core Events from ServiceManager');
            assert.doesNotMatch(eventModule, /\bemitSystemEvent\b/, 'AI events must not depend on a global emitter');
          }
          assert.match(memoryEvents, /ServiceManager\.resolve\s*\(\s*["']events["']\s*\)/, 'Memory events must bridge to Core Events through ServiceManager');
          assert.doesNotMatch(memoryEvents, /\bemitSystemEvent\b/, 'Memory events must not depend on a global emitter');
          assert.match(contextCache, /ENABLE_CONTEXT_CACHE/, 'Context cache flag must control runtime caching');
          assert.match(contextCache, /ENABLE_NAMESPACE_ISOLATION/, 'Context cache keys must respect namespace isolation');
          assert.match(contextWindow, /ENABLE_CONTEXT_RANKING/, 'Context ranking flag must control runtime ranking');
          assert.match(contextWindow, /MAX_QUERY_LENGTH/, 'Context queries must be bounded');
          assert.match(contextStore, /ENABLE_CONTEXT_MEMORY/, 'Memory context type flag must control registration');
          assert.match(contextState, /ENABLE_DIAGNOSTICS/, 'Context diagnostics flag must control metric collection');
          assert.match(toolQueue, /ENABLE_TOOL_QUEUE/, 'Tool queue flag must control queue admission');
          assert.match(toolQueue, /ENABLE_QUEUE_DEDUPLICATION/, 'Tool queue deduplication flag must control duplicate detection');
          assert.match(toolQueue, /ENABLE_PRIORITY_QUEUE/, 'Tool priority flag must control queue ordering');
          assert.match(toolQueue, /ENABLE_EXECUTION_CANCELLATION/, 'Tool cancellation flag must control cancellation');
          assert.match(toolExecutor, /ENABLE_TOOL_TIMEOUTS/, 'Tool timeout flag must control execution timeouts');
          assert.match(toolExecutor, /ENABLE_TOOL_RETRIES/, 'Tool retry flag must control retry attempts');
          assert.match(toolUtils, /ENABLE_STRUCTURED_ERRORS/, 'Structured tool error flag must control error shape');
          assert.match(toolRegistry, /getRegisteredTool/, 'Tool execution must use a private mutable registry record');
          assert.match(toolCircuitBreaker, /ENABLE_CIRCUIT_BREAKER/, 'Circuit breaker flag must control runtime blocking');
          assert.match(toolExecutor, /ENABLE_EXECUTION_HISTORY/, 'Execution history flag must control history writes');
          assert.match(toolExecutor, /ENABLE_RUNTIME_METADATA/, 'Runtime metadata flag must control tool counters');
          assert.match(toolRegistry, /ENABLE_TOOL_DISABLE/, 'Tool disable flag must control enable and disable operations');
          assert.match(toolIndex, /ENABLE_TOOL_SEARCH/, 'Tool search flag must control search results');
          assert.match(toolIndex, /ENABLE_TOOL_INDEXING/, 'Tool indexing flag must control index writes');
          assert.match(toolExecutor, /ENABLE_PERMISSION_CACHE/, 'Permission cache flag must control cached decisions');
          assert.match(toolExecutor, /ENABLE_TOOL_SANDBOX/, 'Tool sandbox flag must control input isolation');
          assert.match(toolLifecycle, /await queueProcessor/, 'Tool shutdown must await the queue processor');
          assert.match(toolLifecycle, /startupPromise ===/, 'Tool startup promise must be cleared after initialization');
          assert.doesNotMatch(toolReset, /\.processing\s*=\s*false/, 'Tool reset must not detach a running queue processor');
          assert.match(plannerQueue, /ENABLE_PLAN_QUEUE/, 'Planner queue flag must control queue admission');
          assert.match(plannerQueue, /MAX_QUEUE_SIZE/, 'Planner queue must enforce its size limit');
          assert.match(planner, /removeQueuedPlan/, 'Planner termination must remove queued plan entries');
          assert.match(plannerRegistry, /executionQueue\s*=/, 'Planner removal must clean the execution queue');
          assert.match(planner, /ENABLE_REPLANNING/, 'Planner retry attempts must respect replanning configuration');
          assert.match(planner, /PLAN_TIMEOUT/, 'Planner execution must enforce plan timeouts');
          assert.match(planner, /ENABLE_EXECUTION_HISTORY/, 'Planner history flag must control history writes');
          assert.match(planner, /ENABLE_PLAN_ABORT/, 'Planner abort flag must control termination');
          assert.match(plan, /ENABLE_DYNAMIC_PLANNING/, 'Dynamic planning flag must control generated versus explicit steps');
          assert.match(plannerDecomposition, /ENABLE_GOAL_DECOMPOSITION/, 'Goal decomposition flag must control step splitting');
          assert.match(plan, /ENABLE_TOOL_SELECTION/, 'Tool selection flag must control step tool assignment');
          assert.match(plan, /ENABLE_AGENT_ASSIGNMENT/, 'Agent assignment flag must control fallback agents');
          assert.match(plan, /ENABLE_ADAPTIVE_STRATEGIES/, 'Adaptive strategy flag must control the default strategy');
          assert.match(plannerState, /ENABLE_DIAGNOSTICS/, 'Planner diagnostics flag must control metric collection');

          console.log('RIGO AI architecture wiring checks passed.');
          EOF

      - name: Verify context manager runtime
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';

          const {default:ContextManager} =
          await import('./js/ai/context/index.js');
          const {
            contextManagerState,
            incrementContextDiagnostic
          } =
          await import('./js/ai/context/context-state.js');
          const {CONTEXT_MANAGER_CONFIG} =
          await import('./js/ai/context/context-config.js');

          await ContextManager.initialize();

          const initialEvictionTimer =
          contextManagerState.evictionTimer;

          assert.ok(initialEvictionTimer);

          const session = await ContextManager.register({
            id:'session-one',
            namespace:'chat:user:a',
            type:'session',
            content:{text:'alpha weather'}
          });
          const runtime = await ContextManager.register({
            id:'runtime-one',
            namespace:'runtime:test',
            type:'runtime',
            content:{text:'runtime beta'}
          });
          const shared = await ContextManager.register({
            id:'shared-one',
            namespace:'shared:test',
            type:'shared',
            content:{text:'shared gamma'}
          });

          assert.equal(contextManagerState.sessions.get(session.id),session);
          assert.equal(contextManagerState.runtimeContexts.get(runtime.id),runtime);
          assert.equal(contextManagerState.sharedContexts.get(shared.id),shared);

          assert.equal(
            (await ContextManager.buildWindow(
              'weather',
              {namespace:'chat:user:a'}
            )).contexts[0].id,
            session.id
          );
          assert.equal(
            (await ContextManager.buildWindow(
              'weather',
              {namespace:'chat:user:b'}
            )).contexts.length,
            0
          );

          assert.equal(
            await ContextManager.update(
              session.id,
              {
                type:'shared',
                content:{text:'updated delta'}
              }
            ),
            true
          );
          assert.equal(contextManagerState.sessions.has(session.id),false);
          assert.equal(contextManagerState.sharedContexts.has(session.id),true);
          assert.equal(
            (await ContextManager.buildWindow(
              'weather',
              {namespace:'chat:user:a'}
            )).contexts[0].content.text,
            'updated delta'
          );
          assert.equal(
            (await ContextManager.buildWindow(
              'delta',
              {namespace:'chat:user:a'}
            )).contexts[0].id,
            session.id
          );

          assert.equal(await ContextManager.remove(session.id),true);
          assert.equal(contextManagerState.sharedContexts.has(session.id),false);
          assert.deepEqual(
            {
              sessions:ContextManager.diagnostics().sessions,
              runtime:ContextManager.diagnostics().runtimeContexts,
              shared:ContextManager.diagnostics().sharedContexts
            },
            {
              sessions:0,
              runtime:1,
              shared:1
            }
          );

          await ContextManager.reset();

          for(let index=0;index<100;index++){
            assert.ok(
              await ContextManager.register({
                id:`session-${index}`,
                namespace:'limit:test',
                type:'session',
                content:{index}
              })
            );
          }

          assert.equal(
            await ContextManager.register({
              id:'session-overflow',
              namespace:'limit:test',
              type:'session',
              content:{overflow:true}
            }),
            false
          );
          assert.equal(ContextManager.diagnostics().sessions,100);

          await ContextManager.reset();

          const now = Date.now();
          const expiredAt =
          now - CONTEXT_MANAGER_CONFIG.MAX_CONTEXT_AGE - 1000;

          const active = await ContextManager.register({
            id:'active-old',
            namespace:'eviction:test',
            type:'session',
            content:{text:'active needle'},
            createdAt:expiredAt,
            updatedAt:expiredAt
          });
          const stale = await ContextManager.register({
            id:'stale-old',
            namespace:'eviction:test',
            type:'session',
            content:{text:'stale haystack'},
            createdAt:expiredAt,
            updatedAt:expiredAt
          });

          await ContextManager.buildWindow(
            'needle',
            {namespace:'eviction:test'}
          );
          assert.equal(
            contextManagerState.contexts.get(active.id).runtime.accessCount,
            1
          );
          assert.ok(
            contextManagerState.contexts
            .get(active.id)
            .runtime
            .lastAccessedAt >= now
          );

          await ContextManager.buildWindow(
            'needle',
            {namespace:'eviction:test'}
          );
          assert.equal(
            contextManagerState.contexts.get(active.id).runtime.accessCount,
            2
          );
          assert.equal(await ContextManager.evictExpired(now),1);
          assert.equal(contextManagerState.contexts.has(active.id),true);
          assert.equal(contextManagerState.contexts.has(stale.id),false);

          const stable = await ContextManager.register({
            id:'stable',
            namespace:'limits:test',
            type:'runtime',
            content:{text:'keep me'}
          });

          assert.equal(
            await ContextManager.register({
              id:'too-large',
              namespace:'limits:test',
              type:'runtime',
              content:'x'.repeat(
                CONTEXT_MANAGER_CONFIG.MAX_CONTENT_SIZE + 1
              )
            }),
            false
          );
          assert.equal(
            await ContextManager.register({
              id:'too-many',
              namespace:'limits:test',
              type:'runtime',
              content:Array.from(
                {
                  length:
                  CONTEXT_MANAGER_CONFIG.MAX_CONTEXT_ITEMS + 1
                },
                (_,index) => index
              )
            }),
            false
          );
          assert.equal(
            await ContextManager.update(
              stable.id,
              {
                content:'x'.repeat(
                  CONTEXT_MANAGER_CONFIG.MAX_CONTENT_SIZE + 1
                )
              }
            ),
            false
          );
          assert.equal(
            contextManagerState.contexts.get(stable.id).content.text,
            'keep me'
          );
          assert.ok(
            ContextManager.diagnostics().diagnostics.rejected >= 3
          );

          await ContextManager.reset();

          const bounded = await ContextManager.register({
            id:'bounded-query',
            namespace:'query:test',
            type:'memory',
            content:{text:'needle context'}
          });
          const queryPrefix =
          'needle ' + 'x'.repeat(
            CONTEXT_MANAGER_CONFIG.MAX_QUERY_LENGTH
          );
          const firstQueryWindow =
          await ContextManager.buildWindow(
            queryPrefix + 'first-suffix',
            {namespace:'query:test'}
          );

          assert.equal(
            firstQueryWindow.query.length,
            CONTEXT_MANAGER_CONFIG.MAX_QUERY_LENGTH
          );
          assert.equal(firstQueryWindow.contexts[0].id,bounded.id);
          assert.equal(ContextManager.diagnostics().cache,1);

          const cachedQueryWindow =
          await ContextManager.buildWindow(
            queryPrefix + 'second-suffix',
            {namespace:'query:test'}
          );

          assert.equal(cachedQueryWindow,firstQueryWindow);
          assert.equal(ContextManager.diagnostics().cache,1);
          assert.equal(
            ContextManager.diagnostics().diagnostics.cacheHits,
            1
          );
          assert.equal(
            contextManagerState.contexts
            .get(bounded.id)
            .runtime
            .accessCount,
            2
          );

          const isolatedQueryWindow =
          await ContextManager.buildWindow(
            queryPrefix + 'second-suffix',
            {namespace:'query:other'}
          );

          assert.equal(isolatedQueryWindow.contexts.length,0);
          assert.equal(ContextManager.diagnostics().cache,2);

          await ContextManager.reset();

          await ContextManager.register({
            id:'budget',
            namespace:'budget:test',
            type:'system',
            content:{text:'budget context'}
          });

          const clampedBudget =
          await ContextManager.buildWindow(
            'budget',
            {
              namespace:'budget:test',
              maxTokens:
              CONTEXT_MANAGER_CONFIG.MAX_CONTEXT_TOKENS * 10
            }
          );
          const maximumBudget =
          await ContextManager.buildWindow(
            'budget',
            {
              namespace:'budget:test',
              maxTokens:CONTEXT_MANAGER_CONFIG.MAX_CONTEXT_TOKENS
            }
          );
          const fallbackBudget =
          await ContextManager.buildWindow(
            'budget',
            {
              namespace:'budget:test',
              maxTokens:-5
            }
          );

          assert.equal(clampedBudget,maximumBudget);
          assert.equal(maximumBudget,fallbackBudget);
          assert.equal(ContextManager.diagnostics().cache,1);
          assert.equal(
            incrementContextDiagnostic('unknown-diagnostic'),
            false
          );
          assert.equal(
            incrementContextDiagnostic('synchronized',2),
            true
          );
          assert.equal(
            ContextManager.diagnostics().diagnostics.synchronized,
            2
          );

          await ContextManager.reset();

          assert.equal(
            contextManagerState.evictionTimer,
            initialEvictionTimer
          );
          assert.equal(ContextManager.diagnostics().contexts,0);
          assert.equal(
            ContextManager.diagnostics().diagnostics.synchronized,
            0
          );

          await ContextManager.shutdown();

          assert.equal(contextManagerState.evictionTimer,null);
          assert.equal(ContextManager.health().initialized,false);

          await ContextManager.initialize();

          assert.ok(contextManagerState.evictionTimer);
          assert.notEqual(
            contextManagerState.evictionTimer,
            initialEvictionTimer
          );
          assert.equal(ContextManager.health().initialized,true);

          await ContextManager.shutdown();

          console.log('Context manager runtime checks passed.');
          EOF

      - name: Verify memory module runtime service
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';

          const store = new Map();
          globalThis.localStorage = {
            get length(){return store.size;},
            key:index => [...store.keys()][index] ?? null,
            getItem:key => store.has(key) ? store.get(key) : null,
            setItem:(key,value) => store.set(key,String(value)),
            removeItem:key => store.delete(key),
            clear:() => store.clear()
          };

          const {updateAuthRuntimeState} =
          await import('./js/auth/auth-state.js');
          const {registerCoreModules} =
          await import('./js/core/modules/module-setup.js');
          const {default:ModuleActivation} =
          await import('./js/core/modules/module-activation.js');
          const {default:ServiceManager} =
          await import('./js/services/service-manager.js');
          const {default:AI} =
          await import('./js/ai/index.js');
          const {MemoryEvents} =
          await import('./js/memory/memory-events.js');
          const {MEMORY_EVENTS} =
          await import('./js/memory/memory-constants.js');
          const {memoryState} =
          await import('./js/memory/memory-state.js');
          const {MemoryEmbeddings} =
          await import('./js/memory/memory-embeddings.js');

          const coreEvents = [];
          let localCreated = null;

          await ServiceManager.register(
            'events',
            async () => ({
              emit:async (name,payload) => {
                coreEvents.push({name,payload});
                return true;
              }
            })
          );

          MemoryEvents.on(
            MEMORY_EVENTS.CREATED,
            payload => {
              localCreated = payload;
            }
          );

          updateAuthRuntimeState({
            authenticated:true,
            user:{id:'memory-runtime-test'}
          });

          registerCoreModules();
          assert.equal(await ModuleActivation.load('memory'),true);
          assert.equal(ServiceManager.has('memory'),true);

          const memory =
          await ServiceManager.resolve('memory');

          assert.deepEqual(
            {
              cleanup:memory.health().scheduler.cleanup,
              summary:memory.health().scheduler.summary,
              indexing:memory.health().scheduler.indexing,
              cloudSync:memory.health().scheduler.cloudSync
            },
            {
              cleanup:true,
              summary:true,
              indexing:true,
              cloudSync:false
            }
          );

          const created = memory.create(
            'RIGO memory runtime bridge',
            {
              type:'fact',
              priority:'high',
              tags:['runtime-test']
            }
          );

          assert.ok(created?.id);

          await new Promise((resolve) => setTimeout(resolve,0));

          assert.equal(localCreated?.id,created.id);
          assert.ok(
            coreEvents.some((event) => {
              return (
                event.name === MEMORY_EVENTS.CREATED &&
                event.payload.source === 'memory-manager' &&
                event.payload.data.id === created.id
              );
            })
          );

          const results = memory.search(
            'runtime bridge',
            {limit:5}
          );

          const summary = memory.summary();

          await new Promise((resolve) => setTimeout(resolve,0));

          assert.ok(
            results.some((entry) => {
              return entry.id === created.id;
            })
          );
          assert.equal(results[0].content,'RIGO memory runtime bridge');
          assert.equal(typeof results[0].score,'number');
          assert.equal(memory.searchOne('runtime bridge').id,created.id);
          assert.match(summary,/rigo memory runtime bridge/);
          assert.ok(
            [
              MEMORY_EVENTS.INDEXED,
              MEMORY_EVENTS.SEARCHED,
              MEMORY_EVENTS.SUMMARIZED
            ]
            .every((name) => {
              return coreEvents.some((event) => event.name === name);
            })
          );
          assert.equal(memory.health().memory.initialized,true);
          assert.ok(memory.health().memory.diagnostics.indexed >= 1);
          assert.equal(memory.health().memory.diagnostics.searches,2);
          assert.equal(memory.health().memory.diagnostics.summarized,1);
          assert.equal(typeof memory.reset,'function');
          assert.equal(typeof memory.snapshot,'function');

          const mutable = memory.create(
            'old embedding phrase',
            {
              type:'fact',
              priority:'normal',
              tags:['mutable-test']
            }
          );

          assert.equal(memory.searchOne('old embedding').id,mutable.id);
          assert.equal(
            MemoryEmbeddings.loadEmbedding(mutable.id).old,
            1
          );
          assert.equal(
            memory.update(mutable.id,{content:'new semantic phrase'}),
            true
          );
          assert.equal(memory.searchOne('old embedding'),null);
          assert.equal(memory.searchOne('new semantic').id,mutable.id);
          assert.equal(
            MemoryEmbeddings.loadEmbedding(mutable.id).old,
