name: Memory Runtime

on:
  push:
    branches: [ai-bootstrap-wiring]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check js/memory/memory-subsystem.js
          node --check js/memory/memory-manager.js
          node --check js/memory/memory-cleanup.js
      - name: Runtime checks
        run: node tests/memory-runtime.test.mjs
