name: Auth Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check js/auth/auth-actions.js
          node --check js/auth/auth-runtime.js
      - name: Runtime checks
        run: node tests/auth-runtime.test.mjs
