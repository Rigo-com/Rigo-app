<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RIGO AI</title><style>
*{box-sizing:border-box;margin:0;padding:0}:root{color-scheme:dark;--bg:#050914;--panel:#111827;--border:#263248;--text:#f8fafc;--muted:#94a3b8}html,body{height:100%;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}body{overflow:hidden}button,textarea{font:inherit;color:inherit}.app{height:100dvh;display:flex;flex-direction:column}.topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ffffff0d}.icon{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;font-size:22px;cursor:pointer}.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700}.brand img{width:29px;height:29px;border-radius:8px}.chat{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:24px 16px 160px}.conversation{width:min(100%,760px);margin:auto}.empty{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.empty img{width:66px;height:66px;border-radius:18px;margin-bottom:18px}.empty h1{font-size:27px;margin-bottom:8px}.empty p{color:var(--muted);line-height:1.5}.message{display:flex;margin-bottom:26px}.message.user{justify-content:flex-end}.bubble{max-width:min(88%,650px);font-size:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#182235;border:1px solid var(--border);border-radius:20px;padding:10px 15px}.assistant .bubble{width:100%;padding:2px 4px}.assistant-label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:7px}.error .bubble{color:#f87171}.typing{display:inline-flex;gap:5px}.typing i{width:6px;height:6px;border-radius:50%;background:#9ca3af;animation:p 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes p{0%,70%,100%{opacity:.25}35%{opacity:1;transform:translateY(-3px)}}.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(180deg,transparent,var(--bg) 24%)}.composer{width:min(100%,760px);margin:auto;background:#111827;border:1px solid #293448;border-radius:26px;padding:10px 10px 9px 15px}.composer textarea{width:100%;max-height:160px;min-height:28px;resize:none;border:0;outline:0;background:transparent;color:white;font-size:16px;line-height:1.5;padding:3px 4px 7px}.composer textarea::placeholder{color:#778398}.composer-row{display:flex;align-items:center;justify-content:space-between}.tool,.send{width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}.tool{background:transparent;font-size:22px}.send{background:#f8fafc;color:#07101d;font-size:19px;font-weight:800}.send:disabled{opacity:.3}.hint{text-align:center;color:#64748b;font-size:10px;margin-top:7px}.backdrop{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.2s;z-index:39}.backdrop.active{opacity:1;pointer-events:auto}.sidebar{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);background:#0a101c;border-right:1px solid var(--border);transform:translateX(-102%);transition:.22s;z-index:40;padding:calc(env(safe-area-inset-top) + 14px) 14px 20px;display:flex;flex-direction:column}.sidebar.active{transform:none}.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.side-brand{display:flex;align-items:center;gap:10px;font-weight:700}.side-brand img{width:34px;height:34px;border-radius:10px}.side-btn,.history-btn{width:100%;border:0;background:transparent;border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer;font-size:15px}.side-btn:hover,.history-btn:hover,.history-btn.active{background:#111827}.history-title{color:#64748b;font-size:11px;font-weight:700;text-transform:uppercase;padding:18px 12px 7px}.history{overflow:auto}.history-btn{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}.side-note{color:var(--muted);font-size:12px;padding:12px}
</style></head><body><div class="app"><header class="topbar"><button class="icon" id="menu">☰</button><div class="brand"><img src="./assets/rigo-logo.PNG" alt=""><span>RIGO AI</span></div><button class="icon" id="new">＋</button></header><div class="backdrop" id="backdrop"></div><aside class="sidebar" id="sidebar"><div class="side-head"><div class="side-brand"><img src="./assets/rigo-logo.PNG" alt=""><span>RIGO AI</span></div><button class="icon" id="close">×</button></div><button class="side-btn" id="side-new">＋ New chat</button><div class="history-title">Chats</div><div class="history" id="history"></div><div class="spacer"></div><button class="side-btn" id="admin">🧠 Admin Studio</button><button class="side-btn" id="debug">🐞 Debug Center</button><div class="side-note">RIGO AI · Main Assistant</div></aside><main class="chat"><section class="messages" id="messages"><div class="conversation" id="conversation"></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message RIGO AI"></textarea><div class="composer-row"><button class="tool" type="button">＋</button><button class="send" id="send" type="submit" disabled>↑</button></div></form><div class="hint">RIGO AI can make mistakes. Check important information.</div></div></main></div><script type="module">
import{applicationReady}from"./js/main.js";import Auth from"./js/auth/index.js";import Chat from"./js/chat/index.js";await applicationReady;if(!Auth.status()?.authenticated){location.replace("./login.html");throw new Error("AUTHENTICATION_REQUIRED")}
const endpoint="/api/admin-ai-chat",STORE="rigo_main_chat_history_v1",conversation=document.getElementById("conversation"),messages=document.getElementById("messages"),historyEl=document.getElementById("history"),form=document.getElementById("form"),input=document.getElementById("input"),send=document.getElementById("send"),sidebar=document.getElementById("sidebar"),backdrop=document.getElementById("backdrop");let store={activeId:null,chats:[]},loading=false;
function id(){return"chat-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||"null");if(x&&Array.isArray(x.chats))store=x}catch{}if(!store.activeId||!store.chats.some(c=>c.id===store.activeId))store.activeId=store.chats[0]?.id||null}function save(){try{localStorage.setItem(STORE,JSON.stringify(store))}catch{}}function active(){return store.chats.find(c=>c.id===store.activeId)||null}function title(chat){const first=chat?.messages?.find(m=>m.role==="user")?.content||"New chat";return first.length>34?first.slice(0,34)+"…":first}function ensureChat(){let c=active();if(!c){c={id:id(),createdAt:Date.now(),updatedAt:Date.now(),messages:[]};store.chats.unshift(c);store.activeId=c.id;save()}return c}
function renderHistory(){historyEl.innerHTML=store.chats.map(c=>`<button class="history-btn ${c.id===store.activeId?"active":""}" data-id="${c.id}">${esc(title(c))}</button>`).join("");historyEl.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{store.activeId=b.dataset.id;save();render();close()})}function render(){const c=active(),list=c?.messages||[];if(!list.length&&!loading)conversation.innerHTML=`<div class="empty"><img src="./assets/rigo-logo.PNG"><h1>How can I help?</h1><p>Ask RIGO anything. Your conversations are saved on this device.</p></div>`;else conversation.innerHTML=list.map(m=>`<div class="message ${m.role==="user"?"user":m.role==="error"?"assistant error":"assistant"}"><div class="bubble">${m.role==="assistant"?'<div class="assistant-label">RIGO</div>':""}${esc(m.content)}</div></div>`).join("")+(loading?'<div class="message assistant"><div class="bubble"><div class="assistant-label">RIGO</div><span class="typing"><i></i><i></i><i></i></span></div></div>':"");renderHistory();requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight)}function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,160)+"px"}function sync(){send.disabled=loading||!input.value.trim()}function aiHistory(c){return(c?.messages||[]).filter(m=>m.role==="user"||m.role==="assistant").slice(-20).map(m=>({role:m.role,content:m.content}))}
async function ask(text,c){const response=await fetch(endpoint,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,messages:aiHistory(c),context:"You are the main user-facing RIGO AI assistant. Be useful, concise and conversational. Do not behave as the private Admin Studio unless explicitly asked."})}),raw=await response.text();let result={};try{result=raw?JSON.parse(raw):{}}catch{result={error:raw}}if(!response.ok||result?.ok===false)throw new Error(result?.error||`RIGO_AI_REQUEST_FAILED:${response.status}`);if(typeof result?.message!=="string"||!result.message.trim())throw new Error("RIGO_AI_EMPTY_RESPONSE");return result.message.trim()}
async function submit(){const text=input.value.trim();if(!text||loading)return;const c=ensureChat();input.value="";resize();loading=true;c.messages.push({role:"user",content:text,timestamp:Date.now()});c.updatedAt=Date.now();save();try{Chat.Actions?.sendMessage?.({role:"user",content:text})}catch{}sync();render();try{const reply=await ask(text,c);c.messages.push({role:"assistant",content:reply,timestamp:Date.now()});try{Chat.Actions?.sendMessage?.({role:"assistant",content:reply})}catch{}}catch(e){c.messages.push({role:"error",content:e?.message||"Unable to reach RIGO AI.",timestamp:Date.now()})}finally{c.updatedAt=Date.now();store.chats.sort((a,b)=>b.updatedAt-a.updatedAt);save();loading=false;sync();render();input.focus()}}
function close(){sidebar.classList.remove("active");backdrop.classList.remove("active")}function newChat(){loading=false;store.activeId=null;save();input.value="";resize();sync();render();close();try{Chat.Actions?.clearChat?.()}catch{}input.focus()}form.onsubmit=e=>{e.preventDefault();submit()};input.oninput=()=>{resize();sync()};input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}};document.getElementById("menu").onclick=()=>{sidebar.classList.add("active");backdrop.classList.add("active")};document.getElementById("close").onclick=close;backdrop.onclick=close;document.getElementById("new").onclick=newChat;document.getElementById("side-new").onclick=newChat;document.getElementById("admin").onclick=()=>location.href="./admin.html";document.getElementById("debug").onclick=()=>location.href="./js/debug/ui/dashboard.html";load();render();resize();sync();
</script></body></html>
