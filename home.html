<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RIGO AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{color-scheme:dark;--bg:#050914;--panel:#111827;--border:#263248;--text:#f8fafc;--muted:#94a3b8}html,body{height:100%;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}body{overflow:hidden}button,textarea,input{font:inherit;color:inherit}.app{height:100dvh;display:flex;flex-direction:column}.topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ffffff0d}.icon{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;font-size:22px;cursor:pointer}.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700}.brand img{width:29px;height:29px;border-radius:8px}.chat{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:24px 16px 160px}.conversation{width:min(100%,760px);margin:auto}.empty{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.empty img{width:66px;height:66px;border-radius:18px;margin-bottom:18px}.empty h1{font-size:27px;margin-bottom:8px}.empty p{color:var(--muted);line-height:1.5}.message{display:flex;margin-bottom:26px}.message.user{justify-content:flex-end}.bubble{max-width:min(88%,650px);font-size:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#182235;border:1px solid var(--border);border-radius:20px;padding:10px 15px}.assistant .bubble{width:100%;padding:2px 4px}.assistant-label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:7px}.error .bubble{color:#f87171}.typing{display:inline-flex;gap:5px}.typing i{width:6px;height:6px;border-radius:50%;background:#9ca3af;animation:p 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes p{0%,70%,100%{opacity:.25}35%{opacity:1;transform:translateY(-3px)}}.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(180deg,transparent,var(--bg) 24%)}.composer{width:min(100%,760px);margin:auto;background:#111827;border:1px solid #293448;border-radius:26px;padding:10px 10px 9px 15px}.composer textarea{width:100%;max-height:160px;min-height:28px;resize:none;border:0;outline:0;background:transparent;color:white;font-size:16px;line-height:1.5;padding:3px 4px 7px}.composer-row{display:flex;align-items:center;justify-content:space-between}.tool,.send{width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}.tool{background:transparent;font-size:22px}.send{background:#f8fafc;color:#07101d;font-size:19px}.send:disabled{opacity:.3}.hint{text-align:center;color:#64748b;font-size:10px;margin-top:7px}.backdrop{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.2s;z-index:39}.backdrop.active{opacity:1;pointer-events:auto}.sidebar{position:fixed;inset:0 auto 0 0;width:min(88vw,340px);background:#0a101c;border-right:1px solid var(--border);transform:translateX(-102%);transition:.22s;z-index:40;padding:calc(env(safe-area-inset-top) + 14px) 12px 20px;display:flex;flex-direction:column}.sidebar.active{transform:none}.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.side-brand{display:flex;align-items:center;gap:10px;font-weight:700}.side-brand img{width:34px;height:34px;border-radius:10px}.side-btn{width:100%;border:0;background:transparent;border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer;font-size:15px}.side-btn:hover{background:#111827}.search-wrap{padding:5px 4px 3px}.search{width:100%;border:1px solid #243047;background:#0d1422;border-radius:11px;outline:none;padding:10px 11px;font-size:14px}.search:focus{border-color:#475569}.history-title{color:#64748b;font-size:11px;font-weight:700;text-transform:uppercase;padding:14px 12px 7px}.history{overflow:auto;min-height:0}.history-empty{color:#64748b;font-size:13px;padding:14px 12px}.history-row{display:flex;align-items:center;gap:4px;border-radius:10px;position:relative}.history-row:hover,.history-row.active{background:#111827}.history-btn{flex:1;min-width:0;border:0;background:transparent;border-radius:10px;padding:10px 8px 10px 12px;text-align:left;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-menu-btn{flex:0 0 34px;width:34px;height:34px;border:0;border-radius:9px;background:transparent;cursor:pointer;color:#94a3b8;font-size:19px}.history-menu-btn:hover{background:#1b2536;color:white}.chat-menu{position:absolute;right:4px;top:37px;width:145px;padding:5px;background:#111827;border:1px solid #334155;border-radius:12px;box-shadow:0 12px 35px #0008;z-index:55}.chat-menu button{width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:13px}.chat-menu button:hover{background:#1b2536}.chat-menu .danger{color:#fca5a5}.rename-box{display:flex;gap:6px;padding:6px}.rename-input{flex:1;min-width:0;border:1px solid #475569;background:#080d18;border-radius:8px;outline:none;padding:8px;font-size:13px}.rename-save,.rename-cancel{border:0;border-radius:8px;padding:7px 8px;cursor:pointer}.rename-save{background:#f8fafc;color:#07101d}.rename-cancel{background:#1f2937}.spacer{flex:1}.logout{color:#fca5a5}.side-note{color:var(--muted);font-size:12px;padding:12px}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><button class="icon" id="menu">☰</button><div class="brand"><img src="./assets/rigo-logo.PNG"><span>RIGO AI</span></div><button class="icon" id="new">＋</button></header>
<div class="backdrop" id="backdrop"></div>
<aside class="sidebar" id="sidebar">
<div class="side-head"><div class="side-brand"><img src="./assets/rigo-logo.PNG"><span>RIGO AI</span></div><button class="icon" id="close">×</button></div>
<button class="side-btn" id="side-new">＋ New chat</button>
<div class="search-wrap"><input class="search" id="chat-search" type="search" placeholder="Search chats" autocomplete="off"></div>
<div class="history-title">Chats</div><div class="history" id="history"></div><div class="spacer"></div>
<button class="side-btn" id="memory">🧠 Memory</button>
<button class="side-btn" id="admin" hidden>🛠 Admin Studio</button>
<button class="side-btn" id="debug" hidden>🐞 Debug Center</button>
<button class="side-btn logout" id="logout">↪ Log out</button>
<div class="side-note">RIGO AI · Main Assistant</div>
</aside>
<main class="chat"><section class="messages" id="messages"><div class="conversation" id="conversation"></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message RIGO AI"></textarea><div class="composer-row"><button class="tool" type="button">＋</button><button class="send" id="send" type="submit" disabled>↑</button></div></form><div class="hint">RIGO AI can make mistakes. Check important information.</div></div></main>
</div>
<script type="module">
import {applicationReady} from "./js/main.js";
import Auth from "./js/auth/index.js";
import Chat from "./js/chat/index.js";
import API from "./js/api/index.js";
import Search from "./js/search/index.js";
import {UiRenderer} from "./js/ui/index.js";

await applicationReady;

const authState=Auth.status();
if(!authState?.authenticated){location.replace("./login.html");throw new Error("AUTHENTICATION_REQUIRED")}

const currentUser=authState?.user||{};
const userIdentity=String(currentUser.id||currentUser.email||"").trim().toLowerCase();
if(!userIdentity){await Auth.logout();location.replace("./login.html");throw new Error("AUTH_USER_IDENTITY_REQUIRED")}

const isAdmin=currentUser.role==="admin";
const adminButton=document.getElementById("admin");
const debugButton=document.getElementById("debug");
if(isAdmin){adminButton.hidden=false;debugButton.hidden=false}

const ENDPOINT="/api/ai-chat";
const WEATHER_ENDPOINT="/api/weather";
const LEGACY_STORE="rigo_main_chat_history_v1";

const conversation=document.getElementById("conversation");
const messages=document.getElementById("messages");
const historyEl=document.getElementById("history");
const form=document.getElementById("form");
const input=document.getElementById("input");
const send=document.getElementById("send");
const sidebar=document.getElementById("sidebar");
const backdrop=document.getElementById("backdrop");
const searchInput=document.getElementById("chat-search");

let loading=false;
let searchQuery="";
let searchResultIds=null;
let searchSequence=0;
let openMenuId=null;
let editingId=null;

const ChatActions=Chat.Actions;
Search.core.initialize();

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}
function store(){return ChatActions.getConversationStore()}
function active(){return ChatActions.getActiveConversation()}
function title(c){const t=String(c?.title||c?.messages?.find(m=>m.role==="user")?.content||"New chat").trim();return t.length>42?t.slice(0,42)+"…":t}
function searchContent(c){return [c?.title,...(c?.messages||[]).map(m=>m?.content)].filter(Boolean).join("\n")}

async function runHistorySearch(){
 const sequence=++searchSequence;
 const query=searchQuery.trim();
 if(!query){searchResultIds=null;renderHistory();return}
 const items=store().chats.map(c=>({id:c.id,content:searchContent(c)}));
 const results=await Search.engine.executeSearch(query,{items,cacheScope:`chat-history:${userIdentity}`});
 if(sequence!==searchSequence)return;
 searchResultIds=new Set(results.map(result=>String(result?.item?.id||"")));renderHistory();
}

function renderHistory(){
 const currentStore=store();
 const filtered=searchQuery.trim()?(searchResultIds===null?[]:currentStore.chats.filter(c=>searchResultIds.has(c.id))):currentStore.chats;
 if(!filtered.length){historyEl.innerHTML=`<div class="history-empty">${searchQuery?(searchResultIds===null?"Searching…":"No matching chats"):"No chats yet"}</div>`;return}
 historyEl.innerHTML=filtered.map(c=>{
  if(editingId===c.id)return`<div class="history-row active" data-row="${esc(c.id)}"><div class="rename-box"><input class="rename-input" data-rename-input value="${esc(title(c)==="New chat"?"":title(c))}" maxlength="80"><button class="rename-save" data-rename-save>✓</button><button class="rename-cancel" data-rename-cancel>×</button></div></div>`;
  return`<div class="history-row ${c.id===currentStore.activeId?"active":""}" data-row="${esc(c.id)}"><button class="history-btn" data-open="${esc(c.id)}">${esc(title(c))}</button><button class="history-menu-btn" data-menu="${esc(c.id)}" aria-label="Chat actions">⋯</button>${openMenuId===c.id?`<div class="chat-menu"><button data-rename="${esc(c.id)}">Rename</button><button class="danger" data-delete="${esc(c.id)}">Delete</button></div>`:""}</div>`;
 }).join("");
 historyEl.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ChatActions.activateConversation(b.dataset.open);openMenuId=null;render();close()});
 historyEl.querySelectorAll("[data-menu]").forEach(b=>b.onclick=e=>{e.stopPropagation();openMenuId=openMenuId===b.dataset.menu?null:b.dataset.menu;editingId=null;renderHistory()});
 historyEl.querySelectorAll("[data-rename]").forEach(b=>b.onclick=e=>{e.stopPropagation();editingId=b.dataset.rename;openMenuId=null;renderHistory();const el=historyEl.querySelector("[data-rename-input]");el?.focus();el?.select()});
 historyEl.querySelectorAll("[data-delete]").forEach(b=>b.onclick=e=>{e.stopPropagation();deleteChat(b.dataset.delete)});
 const renameInput=historyEl.querySelector("[data-rename-input]");
 const renameSave=historyEl.querySelector("[data-rename-save]");
 const renameCancel=historyEl.querySelector("[data-rename-cancel]");
 if(renameInput){const commit=()=>renameChat(editingId,renameInput.value);renameSave.onclick=commit;renameCancel.onclick=()=>{editingId=null;renderHistory()};renameInput.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();commit()}if(e.key==="Escape"){editingId=null;renderHistory()}}}
}

async function renameChat(chatId,value){ChatActions.renameConversation(chatId,value);editingId=null;openMenuId=null;searchResultIds=null;render();if(searchQuery.trim())runHistorySearch();try{await ChatActions.flushConversationStore()}catch{}}
async function deleteChat(chatId){const c=store().chats.find(x=>x.id===chatId);if(!c)return;if(!confirm(`Delete “${title(c)}”?`))return;ChatActions.deleteConversation(chatId);openMenuId=null;editingId=null;searchResultIds=null;render();if(searchQuery.trim())runHistorySearch();try{await ChatActions.flushConversationStore()}catch{}}

function renderNow(){
 const c=active(),list=c?.messages||[];
 conversation.innerHTML=list.length?list.map(m=>`<div class="message ${m.role==="user"?"user":m.role==="error"?"assistant error":"assistant"}"><div class="bubble">${m.role==="assistant"?'<div class="assistant-label">RIGO</div>':""}${esc(m.content)}</div></div>`).join("")+(loading?'<div class="message assistant"><div class="bubble"><div class="assistant-label">RIGO</div><span class="typing"><i></i><i></i><i></i></span></div></div>':""):`<div class="empty"><img src="./assets/rigo-logo.PNG"><h1>How can I help?</h1><p>Your chats, memory and settings stay private to this account and sync across devices.</p></div>`;
 renderHistory();requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight)
}
function render(){if(!UiRenderer.forceRender(renderNow))renderNow()}

function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,160)+"px"}
function sync(){send.disabled=loading||!input.value.trim()}
function aiHistory(c){const list=(c?.messages||[]).filter(m=>m.role==="user"||m.role==="assistant");if(list.at(-1)?.role==="user")list.pop();return list.slice(-20).map(m=>({role:m.role,content:m.content}))}
function needsWeather(text){return/(طقس|الجو|درجة الحرارة|حرارة اليوم|مطر|تمطر|weather|forecast|temperature|rain)/i.test(text)}
function getPosition(){return new Promise((resolve,reject)=>{if(!navigator.geolocation){reject(new Error("GEOLOCATION_NOT_SUPPORTED"));return}navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:12000,maximumAge:300000})})}

async function weatherContext(){const position=await getPosition();const lat=position.coords.latitude,lon=position.coords.longitude;const response=await API.runtime.get(`${WEATHER_ENDPOINT}?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`,{retries:2});const data=response?.data||{};if(data?.ok===false)throw new Error(data?.error||"WEATHER_FAILED");return`LIVE WEATHER TOOL RESULT (current user location; source: ${data.source}):\n${JSON.stringify(data)}`}
async function ask(text,c){let context="You are the main user-facing RIGO AI assistant. Use live tool results when provided.";if(needsWeather(text)){try{context+="\n\n"+await weatherContext()}catch(error){context+=`\n\nWEATHER TOOL STATUS: unavailable because ${error?.message||String(error)}. Ask the user to allow location access or provide a city.`}}const response=await API.runtime.post(ENDPOINT,JSON.stringify({message:text,messages:aiHistory(c),maxTokens:4000,context}),{headers:{"Content-Type":"application/json","Accept":"application/json"},retries:2});const result=response?.data||{};if(result?.ok===false)throw new Error(result?.error||"RIGO_AI_REQUEST_FAILED");if(typeof result?.message!=="string"||!result.message.trim())throw new Error("RIGO_AI_EMPTY_RESPONSE");return result.message.trim()}

async function submit(){const text=input.value.trim();if(!text||loading)return;let c=ChatActions.ensureConversation();const chatId=c.id;input.value="";resize();loading=true;ChatActions.appendConversationMessage(chatId,{role:"user",content:text,createdAt:Date.now()});if(!c.title)ChatActions.renameConversation(chatId,text.slice(0,80));try{ChatActions.sendMessage({role:"user",content:text,userId:userIdentity,conversationId:chatId})}catch{}sync();render();try{c=ChatActions.getActiveConversation();const reply=await ask(text,c);ChatActions.appendConversationMessage(chatId,{role:"assistant",content:reply,createdAt:Date.now()});try{ChatActions.sendMessage({role:"assistant",content:reply,userId:userIdentity,conversationId:chatId})}catch{}}catch(e){ChatActions.appendConversationMessage(chatId,{role:"error",content:e?.message||"Unable to reach RIGO AI.",createdAt:Date.now()})}finally{loading=false;searchResultIds=null;sync();render();if(searchQuery.trim())runHistorySearch();input.focus()}}

function close(){sidebar.classList.remove("active");backdrop.classList.remove("active");openMenuId=null;editingId=null}
function newChat(){loading=false;ChatActions.activateConversation(null);openMenuId=null;editingId=null;input.value="";resize();sync();render();close();input.focus()}

form.addEventListener("submit",e=>{e.preventDefault();submit()});
input.addEventListener("input",()=>{resize();sync()});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}});
searchInput.addEventListener("input",()=>{searchQuery=searchInput.value;searchResultIds=null;openMenuId=null;editingId=null;renderHistory();runHistorySearch()});
document.addEventListener("click",e=>{if(openMenuId&&!e.target.closest(".history-row")){openMenuId=null;renderHistory()}});
document.getElementById("menu").onclick=()=>{sidebar.classList.add("active");backdrop.classList.add("active");setTimeout(()=>searchInput.focus(),150)};
document.getElementById("close").onclick=close;backdrop.onclick=close;document.getElementById("new").onclick=newChat;document.getElementById("side-new").onclick=newChat;document.getElementById("memory").onclick=()=>location.href="./memory.html";
if(isAdmin){adminButton.onclick=()=>location.href="./admin.html";debugButton.onclick=()=>location.href="./debug.html"}
document.getElementById("logout").onclick=async()=>{try{await ChatActions.flushConversationStore()}catch{}await Auth.logout();location.replace("./login.html")};

try{localStorage.removeItem(LEGACY_STORE)}catch{}
await ChatActions.initializeConversationStore(userIdentity);
render();resize();sync();
</script>
</body>
</html>
