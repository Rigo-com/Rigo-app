<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>RIGO AI</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;

      background:#020817;

      font-family:Arial,sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:24px;
    }

    .menu-button{
      position:fixed;

      top:20px;
      right:20px;

      width:48px;
      height:48px;

      border:none;
      border-radius:12px;

      background:#0f172a;

      color:white;

      font-size:22px;

      cursor:pointer;

      border:1px solid #1e293b;

      z-index:1001;
    }

    .sidebar{
      position:fixed;

      top:0;
      right:-280px;

      width:280px;
      height:100vh;

      background:#0f172a;

      border-left:1px solid #1e293b;

      transition:.3s;

      padding:24px;

      z-index:1000;
    }

    .sidebar.active{
      right:0;
    }

    .sidebar-title{
      color:white;

      font-size:22px;
      font-weight:700;

      margin-bottom:24px;
    }

    .menu-link{
      display:block;

      color:#cbd5e1;

      text-decoration:none;

      padding:14px 0;

      border-bottom:1px solid #1e293b;
    }

    .menu-link:hover{
      color:white;
    }

    .home-container{
      width:100%;
      max-width:420px;

      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .logo{
      width:140px;
      height:140px;

      object-fit:contain;

      margin-bottom:24px;
    }

    .title{
      color:white;

      font-size:42px;
      font-weight:700;

      margin-bottom:12px;
    }

    .subtitle{
      color:#94a3b8;

      font-size:18px;

      text-align:center;

      margin-bottom:48px;
    }

    .card{
      width:100%;

      background:#0f172a;

      border:1px solid #1e293b;

      border-radius:20px;

      padding:24px;

      text-align:center;
    }

    .card-title{
      color:white;

      font-size:24px;
      font-weight:700;

      margin-bottom:12px;
    }

    .card-text{
      color:#94a3b8;

      line-height:1.6;
    }

  </style>

</head>

<body>

  <button
    class="menu-button"
    onclick="toggleMenu()">

    ☰

  </button>

  <div
  id="sidebar"
  class="sidebar">

  <div class="sidebar-title">
    RIGO AI
  </div>

  <a
    href="./home.html"
    class="menu-link">
    🏠 Home
  </a>

  <a
    href="./admin.html"
    class="menu-link">
    🧠 Admin Studio
  </a>

  <a
    href="./debug.html"
    class="menu-link">
    🐞 Debug Center
  </a>

</div>

  <div class="home-container">

    <img
      class="logo"
      src="./assets/rigo-logo.PNG"
      alt="RIGO AI">

    <h1 class="title">
      RIGO AI
    </h1>

    <p class="subtitle">
      One App. Unlimited Possibilities.
    </p>

    <div class="card">

      <div class="card-title">
        Welcome
      </div>

      <div class="card-text">
        You have successfully signed in to RIGO AI.
      </div>

    </div>

  </div>

  <script>

    function toggleMenu(){

      document
      .getElementById(
        "sidebar"
      )
      .classList
      .toggle(
        "active"
      );

    }

  </script>

  <script
    type="module"
    src="./js/main.js">
  </script>

</body>

</html>
